- name: Inspect official sing-box source
        shell: bash
        run: |
          set -euo pipefail

          echo "========== constant/v2ray.go =========="
          sed -n '1,300p' constant/v2ray.go

          echo
          echo "========== option/v2ray_transport.go =========="
          sed -n '1,420p' option/v2ray_transport.go

          echo
          echo "========== transport/v2ray/transport.go =========="
          sed -n '1,500p' transport/v2ray/transport.go

          echo
          echo "========== transport/v2ray =========="
          find transport/v2ray -maxdepth 1 -type f -print | sort

          echo
          echo "========== V2Ray transport definitions =========="
          grep -Rni \
            -E \
            'type .*Transport|TransportType|NewServerTransport|NewClientTransport|TransportOptions|HTTPOptions' \
            constant \
            option \
            transport/v2ray \
            2>/dev/null |
            head -n 500
