name: Find sing-box-lx XHTTP commits

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  find-xhttp-commits:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout official sing-box
        uses: actions/checkout@v5
        with:
          repository: SagerNet/sing-box
          ref: v1.14.1
          fetch-depth: 1
          submodules: recursive

      - name: Fetch sing-box-lx
        run: |
          set -euxo pipefail

          git remote add lx https://github.com/Leadaxe/sing-box-lx.git

          git fetch \
            --no-tags \
            --depth=500 \
            lx \
            v1.14.1-lx.8

          echo "========================================"
          echo "Official:"
          git rev-parse HEAD
          echo "========================================"

          echo "LX:"
          git rev-parse FETCH_HEAD
          echo "========================================"

      - name: Show LX commits
        run: |
          set -euxo pipefail

          echo
          echo "========================================"
          echo "ALL LX COMMITS"
          echo "========================================"
          git log \
            --oneline \
            --decorate \
            --no-merges \
            HEAD..FETCH_HEAD

          echo
          echo "========================================"
          echo "XHTTP RELATED COMMITS"
          echo "========================================"

          git log \
            --oneline \
            --decorate \
            --no-merges \
            HEAD..FETCH_HEAD \
            -- \
            option/v2ray_xhttp.go \
            option/v2ray_transport.go \
            include/v2rayxhttp.go \
            transport/v2rayxhttp \
            transport/v2ray/transport.go \
            transport/v2ray/registry.go \
            common/badh2 \
            constant/v2ray.go

      - name: Show XHTTP changed files
        run: |
          set -euxo pipefail

          echo
          echo "========================================"
          echo "XHTTP RELATED FILE CHANGES"
          echo "========================================"

          git diff \
            --name-status \
            HEAD \
            FETCH_HEAD \
            -- \
            option/v2ray_xhttp.go \
            option/v2ray_transport.go \
            include/v2rayxhttp.go \
            transport/v2rayxhttp \
            transport/v2ray/transport.go \
            transport/v2ray/registry.go \
            common/badh2 \
            constant/v2ray.go

      - name: Show detailed XHTTP commits
        run: |
          set -euxo pipefail

          echo
          echo "========================================"
          echo "DETAILED XHTTP COMMITS"
          echo "========================================"

          for commit in $(git log \
            --format='%H' \
            --reverse \
            HEAD..FETCH_HEAD \
            -- \
            option/v2ray_xhttp.go \
            option/v2ray_transport.go \
            include/v2rayxhttp.go \
            transport/v2rayxhttp \
            transport/v2ray/transport.go \
            transport/v2ray/registry.go \
            common/badh2 \
            constant/v2ray.go
          ); do

            echo
            echo "----------------------------------------"
            echo "COMMIT: ${commit}"
            git show \
              --no-renames \
              --format=fuller \
              --stat \
              "${commit}"

            echo
            echo "FILES:"
            git diff-tree \
              --no-commit-id \
              --name-status \
              -r \
              "${commit}"
          done

      - name: Show exact XHTTP diff summary
        run: |
          set -euxo pipefail

          echo
          echo "========================================"
          echo "EXACT XHTTP DIFF SUMMARY"
          echo "========================================"

          git diff \
            --stat \
            HEAD \
            FETCH_HEAD \
            -- \
            option/v2ray_xhttp.go \
            option/v2ray_transport.go \
            include/v2rayxhttp.go \
            transport/v2rayxhttp \
            transport/v2ray/transport.go \
            transport/v2ray/registry.go \
            common/badh2 \
            constant/v2ray.go

          echo
          echo "========================================"
          echo "XmuxRange"
          echo "========================================"

          git grep -n "XmuxRange" FETCH_HEAD -- \
            ':!docs' \
            ':!SPECS' \
            || true

          echo
          echo "========================================"
          echo "V2RayTransportTypeXHTTP"
          echo "========================================"

          git grep -n "V2RayTransportTypeXHTTP" FETCH_HEAD -- \
            ':!docs' \
            ':!SPECS' \
            || true

          echo
          echo "========================================"
          echo "common/badh2"
          echo "========================================"

          git ls-tree -r --name-only FETCH_HEAD | grep '^common/badh2/' || true

          echo
          echo "========================================"
          echo "DONE"
          echo "========================================"
