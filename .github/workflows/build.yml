- name: Inspect official V2Ray transport source
        shell: bash
        run: |
          set -euo pipefail

          echo "========== constant/v2ray.go =========="
          sed -n '1,260p' constant/v2ray.go

          echo
          echo "========== option/v2ray_transport.go =========="
          sed -n '1,360p' option/v2ray_transport.go

          echo
          echo "========== transport/v2ray/transport.go =========="
          sed -n '1,420p' transport/v2ray/transport.go

          echo
          echo "========== transport/v2ray/registry.go =========="
          if [ -f transport/v2ray/registry.go ]; then
            sed -n '1,360p' transport/v2ray/registry.go
          else
            echo "registry.go does not exist"
          fi

          echo
          echo "========== V2Ray transport symbols =========="
          grep -Rni \
            -E \
            'TransportType|V2RayTransport|NewClient|NewServer|Register' \
            constant \
            option \
            transport/v2ray \
            2>/dev/null |
            head -n 300 || true
