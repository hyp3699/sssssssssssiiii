name: Build sing-box XHTTP

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *"

permissions:
  contents: write

jobs:
  get-version:
    name: Get latest stable version
    runs-on: ubuntu-latest

    outputs:
      upstream_version: ${{ steps.version.outputs.upstream_version }}
      lx_tag: ${{ steps.version.outputs.lx_tag }}

    steps:
      - name: Get latest stable sing-box version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          echo "正在获取最新 sing-box 正式版..."

          UPSTREAM_VERSION=$(curl -fsSL \
            "https://api.github.com/repos/SagerNet/sing-box/releases/latest" \
            | jq -r '.tag_name')

          if [ -z "$UPSTREAM_VERSION" ] || [ "$UPSTREAM_VERSION" = "null" ]; then
            echo "无法获取 sing-box 最新版本"
            exit 1
          fi

          echo "Upstream stable: $UPSTREAM_VERSION"

          echo "正在查找对应 sing-box-lx 版本..."

          LX_TAG=$(curl -fsSL \
            "https://api.github.com/repos/Leadaxe/sing-box-lx/tags?per_page=100" \
            | jq -r --arg v "${UPSTREAM_VERSION}" '
                .[]
                | .name
                | select(startswith($v + "-lx."))
              ' \
            | sort -V \
            | tail -n 1)

          if [ -z "$LX_TAG" ]; then
            echo "没有找到对应的 sing-box-lx 版本"
            echo "Upstream: $UPSTREAM_VERSION"
            exit 1
          fi

          echo "sing-box-lx: $LX_TAG"

          echo "upstream_version=$UPSTREAM_VERSION" >> "$GITHUB_OUTPUT"
          echo "lx_tag=$LX_TAG" >> "$GITHUB_OUTPUT"


  build:
    name: Build ${{ matrix.arch }}
    needs: get-version
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            goarch: amd64
            output: sing-box-linux-amd64
          - arch: arm64
            goarch: arm64
            output: sing-box-linux-arm64

    steps:
      - name: Checkout sing-box-lx
        uses: actions/checkout@v4
        with:
          repository: Leadaxe/sing-box-lx
          ref: ${{ needs.get-version.outputs.lx_tag }}
          fetch-depth: 0
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            curl \
            jq \
            ca-certificates

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: true

      - name: Show build information
        run: |
          echo "======================================"
          echo "sing-box custom build"
          echo "======================================"
          echo "Upstream version : ${{ needs.get-version.outputs.upstream_version }}"
          echo "LX version       : ${{ needs.get-version.outputs.lx_tag }}"
          echo "Architecture     : ${{ matrix.arch }}"
          echo "Go architecture  : ${{ matrix.goarch }}"
          echo "Build tags       : with_xhttp with_v2ray_api"
          echo "======================================"

          go version
          git describe --tags --always --dirty || true

      - name: Download Go dependencies
        run: |
          go mod download

      - name: Build sing-box
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail

          VERSION="${{ needs.get-version.outputs.lx_tag }}"

          LDFLAGS="-s -w -X github.com/sagernet/sing-box/constant.Version=${VERSION}"

          echo "开始编译..."
          echo "GOOS=${GOOS}"
          echo "GOARCH=${GOARCH}"
          echo "TAGS=with_xhttp with_v2ray_api"

          go build \
            -trimpath \
            -tags "with_xhttp with_v2ray_api" \
            -ldflags "${LDFLAGS}" \
            -o "${{ matrix.output }}" \
            ./cmd/sing-box

      - name: Verify binary
        run: |
          set -euo pipefail

          BINARY="${{ matrix.output }}"

          echo "检查文件..."
          ls -lh "$BINARY"

          file "$BINARY"

          echo
          echo "检查 sing-box 版本..."
          ./"$BINARY" version

          echo
          echo "检查 XHTTP..."
          ./"$BINARY" help 2>/dev/null | grep -qi xhttp || true

          echo
          echo "检查完成"

      - name: Create archive
        run: |
          set -euo pipefail

          mkdir -p release

          cp "${{ matrix.output }}" \
             "release/sing-box"

          tar -C release \
            -czf "${{ matrix.output }}.tar.gz" \
            sing-box

          rm -f release/sing-box

          sha256sum \
            "${{ matrix.output }}.tar.gz" \
            > "${{ matrix.output }}.sha256"

          ls -lh \
            "${{ matrix.output }}.tar.gz" \
            "${{ matrix.output }}.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.output }}
          path: |
            ${{ matrix.output }}.tar.gz
            ${{ matrix.output }}.sha256


  release:
    name: Create GitHub Release
    needs:
      - get-version
      - build

    runs-on: ubuntu-latest

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release

      - name: Prepare release files
        run: |
          set -euo pipefail

          mkdir -p upload

          find release -type f -print

          find release \
            -type f \
            \( -name "*.tar.gz" -o -name "*.sha256" \) \
            -exec cp {} upload/ \;

          echo
          echo "Release files:"
          ls -lh upload

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.get-version.outputs.lx_tag }}-custom
          name: sing-box ${{ needs.get-version.outputs.lx_tag }} XHTTP
          generate_release_notes: true
          files: |
            upload/*.tar.gz
            upload/*.sha256
