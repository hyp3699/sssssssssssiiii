name: Build sing-box

on:
  workflow_dispatch:
  schedule:
    - cron: "30 2 * * *"

permissions:
  contents: write

jobs:
  get-version:
    runs-on: ubuntu-24.04
    outputs:
      upstream_version: ${{ steps.version.outputs.upstream_version }}

    steps:
      - name: Get latest official version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          UPSTREAM_VERSION="$(
            curl -fsSL https://api.github.com/repos/SagerNet/sing-box/releases/latest |
            jq -r '.tag_name' |
            sed 's/^v//'
          )"

          [ -n "$UPSTREAM_VERSION" ] || {
            echo "Failed to detect latest official sing-box version"
            exit 1
          }

          echo "upstream_version=${UPSTREAM_VERSION}" >> "$GITHUB_OUTPUT"

          echo "Official sing-box: v${UPSTREAM_VERSION}"

  build:
    needs: get-version
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        arch:
          - amd64
          - arm64

    steps:
      - name: Checkout official sing-box
        uses: actions/checkout@v5
        with:
          repository: SagerNet/sing-box
          ref: v${{ needs.get-version.outputs.upstream_version }}
          fetch-depth: 1
          submodules: recursive

      - name: Add sing-xhttp
        shell: bash
        run: |
          set -euo pipefail

          XHTTP_VERSION="v0.1.6"

          echo "Installing sing-xhttp ${XHTTP_VERSION}"

          go mod edit \
            -require=github.com/justinwoo280/sing-xhttp@${XHTTP_VERSION}

          go mod download github.com/justinwoo280/sing-xhttp@${XHTTP_VERSION}

          echo
          echo "sing-xhttp module:"
          go list -m github.com/justinwoo280/sing-xhttp

      - name: Add XHTTP integration
        shell: bash
        run: |
          set -euo pipefail

          echo "Preparing XHTTP integration..."

          test -f constant/v2ray.go
          test -f option/v2ray_transport.go
          test -f transport/v2ray/transport.go

          mkdir -p transport/v2ray

          cat > transport/v2ray/xhttp.go <<'EOF'
          package v2ray

          import (
              "context"

              "github.com/sagernet/sing-box/adapter"
              "github.com/sagernet/sing-box/option"
              "github.com/sagernet/sing-box/transport/v2rayxhttp"
              "github.com/justinwoo280/sing-xhttp/xhttp"
              "github.com/sagernet/sing/common"
              "github.com/sagernet/sing/common/logger"
              "github.com/sagernet/sing/common/network"
          )

          func newXHTTPServer(
              ctx context.Context,
              logger logger.Logger,
              options option.V2RayXHTTPOptions,
              handler adapter.V2RayServerTransportHandler,
          ) (adapter.V2RayServerTransport, error) {
              xOptions := xhttp.Options{
                  Mode:                    options.Mode,
                  Host:                    options.Host,
                  Path:                    options.Path,
                  Headers:                 options.Headers,
                  SessionPlacement:        options.SessionPlacement,
                  SessionKey:              options.SessionKey,
                  SeqPlacement:            options.SeqPlacement,
                  SeqKey:                  options.SeqKey,
                  XPaddingObfsMode:        options.XPaddingObfsMode,
                  XPaddingPlacement:       options.XPaddingPlacement,
                  XPaddingHeader:          options.XPaddingHeader,
                  XPaddingKey:             options.XPaddingKey,
                  XPaddingMethod:          options.XPaddingMethod,
                  UplinkDataPlacement:     options.UplinkDataPlacement,
                  UplinkDataKey:           options.UplinkDataKey,
                  UplinkChunkSize:         options.UplinkChunkSize,
                  SessionIDTable:          options.SessionIDTable,
                  SessionIDLength:         options.SessionIDLength,
                  SCMaxEachPostBytes:      options.SCMaxEachPostBytes,
                  SCMinPostsIntervalMS:    options.SCMinPostsIntervalMS,
                  SCMaxBufferedPosts:      options.SCMaxBufferedPosts,
                  SCStreamUpServerSecs:    options.SCStreamUpServerSecs,
                  XPaddingBytes:           options.XPaddingBytes,
                  DownloadSettings:        options.DownloadSettings,
                  XMux:                    options.XMux,
              }

              return xhttp.NewServer(ctx, logger, xOptions, handler)
          }

          func newXHTTPClient(
              ctx context.Context,
              logger logger.Logger,
              options option.V2RayXHTTPOptions,
              dialer network.Dialer,
          ) (adapter.V2RayClientTransport, error) {
              xOptions := xhttp.Options{
                  Mode:                    options.Mode,
                  Host:                    options.Host,
                  Path:                    options.Path,
                  Headers:                 options.Headers,
                  SessionPlacement:        options.SessionPlacement,
                  SessionKey:              options.SessionKey,
                  SeqPlacement:            options.SeqPlacement,
                  SeqKey:                  options.SeqKey,
                  XPaddingObfsMode:        options.XPaddingObfsMode,
                  XPaddingPlacement:       options.XPaddingPlacement,
                  XPaddingHeader:          options.XPaddingHeader,
                  XPaddingKey:             options.XPaddingKey,
                  XPaddingMethod:          options.XPaddingMethod,
                  UplinkDataPlacement:     options.UplinkDataPlacement,
                  UplinkDataKey:           options.UplinkDataKey,
                  UplinkChunkSize:         options.UplinkChunkSize,
                  SessionIDTable:          options.SessionIDTable,
                  SessionIDLength:         options.SessionIDLength,
                  SCMaxEachPostBytes:      options.SCMaxEachPostBytes,
                  SCMinPostsIntervalMS:    options.SCMinPostsIntervalMS,
                  SCMaxBufferedPosts:      options.SCMaxBufferedPosts,
                  SCStreamUpServerSecs:    options.SCStreamUpServerSecs,
                  XPaddingBytes:           options.XPaddingBytes,
                  DownloadSettings:        options.DownloadSettings,
                  XMux:                    options.XMux,
              }

              return xhttp.NewClient(ctx, logger, xOptions, dialer)
          }

          var _ adapter.V2RayServerTransport = (*xhttp.ServerTransport)(nil)
          var _ adapter.V2RayClientTransport = (*xhttp.ClientTransport)(nil)

          var _ = common.DefaultDialer
          var _ = v2rayxhttp.Client{}
          EOF

          echo
          echo "XHTTP bridge created."

      - name: Show XHTTP API
        shell: bash
        run: |
          set -euo pipefail

          echo "========== sing-xhttp adapter.go =========="
          MOD_DIR="$(go env GOPATH)/pkg/mod/github.com/justinwoo280/sing-xhttp@v0.1.6"

          test -d "$MOD_DIR"

          sed -n '1,320p' "$MOD_DIR/xhttp/adapter.go"

          echo
          echo "========== sing-xhttp options =========="
          sed -n '1,420p' "$MOD_DIR/xhttp/options.go" 2>/dev/null || true

          echo
          echo "========== sing-xhttp constructors =========="
          grep -Rni \
            -E \
            'func NewServer|func NewClient|type Options|type ServerTransport|type ClientTransport' \
            "$MOD_DIR/xhttp" |
            head -n 100

      - name: Patch sing-box XHTTP transport
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path

          p = Path("constant/v2ray.go")
          s = p.read_text()

          if "V2RayTransportTypeXHTTP" not in s:
              marker = 'V2RayTransportTypeHTTP'
              pos = s.find(marker)

              if pos == -1:
                  print("Could not find V2Ray transport constants.")
                  print(s)
                  raise SystemExit(1)

              line_end = s.find("\n", pos)

              s = (
                  s[:line_end + 1]
                  + '\tV2RayTransportTypeXHTTP = "xhttp"\n'
                  + s[line_end + 1:]
              )

              p.write_text(s)

          print("XHTTP constant installed.")
          PY

          echo
          grep -n "V2RayTransportTypeXHTTP" constant/v2ray.go

      - name: Add XHTTP option type
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path

          p = Path("option/v2ray_transport.go")
          s = p.read_text()

          if "V2RayXHTTPOptions" in s:
              print("V2RayXHTTPOptions already exists.")
              raise SystemExit(0)

          insert = r'''
          type V2RayXHTTPOptions struct {
              Mode                 string                         `json:"mode,omitempty"`
              Host                 string                         `json:"host,omitempty"`
              Path                 string                         `json:"path,omitempty"`
              Headers              map[string]string              `json:"headers,omitempty"`
              SessionPlacement     string                         `json:"session_placement,omitempty"`
              SessionKey           string                         `json:"session_key,omitempty"`
              SeqPlacement         string                         `json:"seq_placement,omitempty"`
              SeqKey               string                         `json:"seq_key,omitempty"`
              XPaddingObfsMode     bool                           `json:"x_padding_obfs_mode,omitempty"`
              XPaddingPlacement    string                         `json:"x_padding_placement,omitempty"`
              XPaddingHeader       string                         `json:"x_padding_header,omitempty"`
              XPaddingKey          string                         `json:"x_padding_key,omitempty"`
              XPaddingMethod       string                         `json:"x_padding_method,omitempty"`
              UplinkDataPlacement  string                         `json:"uplink_data_placement,omitempty"`
              UplinkDataKey        string                         `json:"uplink_data_key,omitempty"`
              UplinkChunkSize      *RangeConfig[int64]             `json:"uplink_chunk_size,omitempty"`
              SessionIDTable       string                         `json:"session_id_table,omitempty"`
              SessionIDLength      *RangeConfig[int]                `json:"session_id_length,omitempty"`
              SCMaxEachPostBytes   *RangeConfig[int64]             `json:"sc_max_each_post_bytes,omitempty"`
              SCMinPostsIntervalMS *RangeConfig[int]                `json:"sc_min_posts_interval_ms,omitempty"`
              SCMaxBufferedPosts   int                            `json:"sc_max_buffered_posts,omitempty"`
              SCStreamUpServerSecs *RangeConfig[int]                `json:"sc_stream_up_server_secs,omitempty"`
              XPaddingBytes        *RangeConfig[int]                `json:"x_padding_bytes,omitempty"`
              DownloadSettings     *V2RayXHTTPDownloadSettings      `json:"download_settings,omitempty"`
              XMux                 *V2RayXHTTPXMuxOptions           `json:"xmux,omitempty"`
          }

          type V2RayXHTTPDownloadSettings struct {
              Host string `json:"host,omitempty"`
              Path string `json:"path,omitempty"`
          }

          type V2RayXHTTPXMuxOptions struct {
              MaxConcurrency     *RangeConfig[int] `json:"max_concurrency,omitempty"`
              MaxConnections     *RangeConfig[int] `json:"max_connections,omitempty"`
              CMaxReuseTimes     *RangeConfig[int] `json:"c_max_reuse_times,omitempty"`
              HMaxRequestTimes   *RangeConfig[int] `json:"h_max_request_times,omitempty"`
              HMaxReusableSecs   *RangeConfig[int] `json:"h_max_reusable_secs,omitempty"`
          }
          '''

          marker = "type V2RayTransportOptions struct"

          pos = s.find(marker)

          if pos == -1:
              print("Could not find V2RayTransportOptions.")
              raise SystemExit(1)

          s = s[:pos] + insert + "\n" + s[pos:]

          p.write_text(s)
          PY

          echo "XHTTP option type added."

      - name: Patch V2Ray transport options
        shell: bash
        run: |
          set -euo pipefail

          sed -n '1,260p' option/v2ray_transport.go

      - name: Patch V2Ray transport dispatch
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path

          p = Path("transport/v2ray/transport.go")
          s = p.read_text()

          if "case C.V2RayTransportTypeXHTTP:" in s:
              print("XHTTP dispatch already exists.")
              raise SystemExit(0)

          if "case C.V2RayTransportTypeHTTP:" not in s:
              print("Could not find HTTP transport switch.")
              print(s)
              raise SystemExit(1)

          target = "case C.V2RayTransportTypeHTTP:"

          replacement = '''case C.V2RayTransportTypeXHTTP:
              return newXHTTPServer(ctx, logger, options.XHTTP, handler)
          case C.V2RayTransportTypeHTTP:
          '''

          s = s.replace(target, replacement, 1)

          marker = "case C.V2RayTransportTypeHTTP:"

          pos = s.find(marker)

          second = s.find(marker, pos + len(marker))

          if second == -1:
              print("Could not find second HTTP transport switch.")
              raise SystemExit(1)

          s = (
              s[:second]
              + "case C.V2RayTransportTypeXHTTP:\n"
                "\t\treturn newXHTTPClient(ctx, logger, options.XHTTP, dialer)\n\t"
              + s[second:]
          )

          p.write_text(s)
          PY

          echo "V2Ray XHTTP dispatch patched."

      - name: Verify XHTTP integration
        shell: bash
        run: |
          set -euo pipefail

          echo "========== XHTTP references =========="

          grep -Rni \
            -E \
            'V2RayTransportTypeXHTTP|V2RayXHTTPOptions|newXHTTPServer|newXHTTPClient' \
            constant \
            option \
            transport/v2ray \
            | head -n 200

          echo
          echo "========== sing-xhttp module =========="

          go list -m all |
            grep 'github.com/justinwoo280/sing-xhttp'

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.8"
          cache: true

      - name: Build sing-box
        shell: bash
        env:
          CGO_ENABLED: "0"
          GOOS: linux
        run: |
          set -euxo pipefail

          if [ "${{ matrix.arch }}" = "amd64" ]; then
            GOARCH=amd64
          else
            GOARCH=arm64
          fi

          OFFICIAL_VERSION="${{ needs.get-version.outputs.upstream_version }}"

          OFFICIAL_TAGS="$(
            tr '\n' ',' < release/DEFAULT_BUILD_TAGS |
            sed 's/,$//'
          )"

          TAGS="${OFFICIAL_TAGS},with_purego,with_v2ray_api"

          LDFLAGS_SHARED="$(cat release/LDFLAGS)"

          echo "Official version: v${OFFICIAL_VERSION}"
          echo "Architecture: ${GOARCH}"
          echo "Build tags: ${TAGS}"
          echo "LDFLAGS: ${LDFLAGS_SHARED}"

          go mod tidy
          go mod download

          GOARCH="${GOARCH}" \
          go build \
            -v \
            -trimpath \
            -o "sing-box-linux-${{ matrix.arch }}" \
            -tags "${TAGS}" \
            -ldflags "-X 'github.com/sagernet/sing-box/constant.Version=${OFFICIAL_VERSION}' ${LDFLAGS_SHARED} -s -w -buildid=" \
            ./cmd/sing-box

      - name: Check build
        shell: bash
        run: |
          set -euxo pipefail

          chmod +x "sing-box-linux-${{ matrix.arch }}"

          "./sing-box-linux-${{ matrix.arch }}" version

          echo
          echo "Binary:"
          ls -lh "sing-box-linux-${{ matrix.arch }}"

          file "sing-box-linux-${{ matrix.arch }}"

      - name: Upload Artifact
        uses: actions/upload-artifact@v5
        with:
          name: sing-box-${{ needs.get-version.outputs.upstream_version }}-xhttp-v2rayapi-linux-${{ matrix.arch }}
          path: sing-box-linux-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 90

  release:
    needs:
      - get-version
      - build

    runs-on: ubuntu-24.04

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v5
        with:
          path: release-files

      - name: Prepare release files
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p release

          find release-files \
            -type f \
            -name 'sing-box-linux-amd64' \
            -exec cp {} release/sing-box-linux-amd64 \;

          find release-files \
            -type f \
            -name 'sing-box-linux-arm64' \
            -exec cp {} release/sing-box-linux-arm64 \;

          test -f release/sing-box-linux-amd64
          test -f release/sing-box-linux-arm64

          chmod +x \
            release/sing-box-linux-amd64 \
            release/sing-box-linux-arm64

          tar -czf \
            release/sing-box-linux-amd64.tar.gz \
            -C release \
            sing-box-linux-amd64

          tar -czf \
            release/sing-box-linux-arm64.tar.gz \
            -C release \
            sing-box-linux-arm64

          rm -f \
            release/sing-box-linux-amd64 \
            release/sing-box-linux-arm64

          ls -lh release

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.get-version.outputs.upstream_version }}-xhttp-v2rayapi
          name: sing-box v${{ needs.get-version.outputs.upstream_version }} XHTTP + V2Ray API
          make_latest: false
          generate_release_notes: false

          body: |
            Based on official SagerNet/sing-box v${{ needs.get-version.outputs.upstream_version }}

            Added:
            - sing-xhttp v0.1.6
            - XHTTP server/inbound
            - XHTTP client/outbound
            - V2Ray API

            Official sing-box build features are preserved.

            Architectures:
            - Linux amd64
            - Linux arm64

          files: |
            release/sing-box-linux-amd64.tar.gz
            release/sing-box-linux-arm64.tar.gz

          fail_on_unmatched_files: true
