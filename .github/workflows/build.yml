name: Build sing-box

on:
  workflow_dispatch:
  schedule:
    - cron: "30 2 * * *"

permissions:
  contents: write

jobs:
  get-version:
    runs-on: ubuntu-24.04
    outputs:
      upstream_version: ${{ steps.version.outputs.upstream_version }}
      lx_tag: ${{ steps.version.outputs.lx_tag }}
    steps:
      - name: Get latest stable versions
        id: version
        shell: bash
        run: |
          set -euo pipefail

          UPSTREAM_VERSION="$(
            curl -fsSL https://api.github.com/repos/SagerNet/sing-box/releases/latest |
            jq -r '.tag_name' |
            sed 's/^v//'
          )"

          [ -n "$UPSTREAM_VERSION" ] || {
            echo "Failed to detect latest official sing-box version"
            exit 1
          }

          LX_TAG="$(
            git ls-remote --tags --refs \
              https://github.com/Leadaxe/sing-box-lx.git \
              "refs/tags/v${UPSTREAM_VERSION}-lx.*" |
            awk -F/ '{print $3}' |
            sort -V |
            tail -n1
          )"

          [ -n "$LX_TAG" ] || {
            echo "No matching sing-box-lx tag found for v${UPSTREAM_VERSION}"
            exit 1
          }

          echo "upstream_version=${UPSTREAM_VERSION}" >> "$GITHUB_OUTPUT"
          echo "lx_tag=${LX_TAG}" >> "$GITHUB_OUTPUT"

          echo "Official: v${UPSTREAM_VERSION}"
          echo "LX: ${LX_TAG}"

  build:
    needs: get-version
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        arch:
          - amd64
          - arm64

    steps:
      - name: Checkout official sing-box
        uses: actions/checkout@v5
        with:
          repository: SagerNet/sing-box
          ref: v${{ needs.get-version.outputs.upstream_version }}
          fetch-depth: 1
          submodules: recursive

      - name: Fetch matching sing-box-lx
        shell: bash
        run: |
          set -euxo pipefail

          git remote add lx https://github.com/Leadaxe/sing-box-lx.git

          git fetch \
            --filter=blob:none \
            --no-tags \
            lx \
            "refs/tags/${{ needs.get-version.outputs.lx_tag }}:refs/remotes/lx/${{ needs.get-version.outputs.lx_tag }}"

      - name: Import XHTTP only
        shell: bash
        run: |
          set -euo pipefail

          OFFICIAL_COMMIT="$(git rev-parse HEAD)"
          LX_REF="refs/remotes/lx/${{ needs.get-version.outputs.lx_tag }}"
          LX_COMMIT="$(git rev-parse "$LX_REF")"

          echo "Official commit: ${OFFICIAL_COMMIT}"
          echo "LX commit: ${LX_COMMIT}"

          if ! git merge-base --is-ancestor "$OFFICIAL_COMMIT" "$LX_COMMIT"; then
            echo "ERROR: LX tag is not based on the official version."
            echo "Official: ${OFFICIAL_COMMIT}"
            echo "LX: ${LX_COMMIT}"
            exit 1
          fi

          XHTTP_PATCH="/tmp/xhttp.patch"
          XHTTP_APPLIED="/tmp/xhttp-applied-commits"

          : > "$XHTTP_APPLIED"

          ALLOWED_REGEX='^(common/badh2/|include/v2rayxhttp\.go$|option/v2ray_xhttp.*\.go$|transport/v2rayxhttp/|constant/v2ray\.go$|option/v2ray_transport\.go$|transport/v2ray/(registry|transport)\.go$)'

          echo "Scanning LX history for XHTTP commits..."

          mapfile -t ALL_COMMITS < <(
            git rev-list --reverse \
              "${OFFICIAL_COMMIT}..${LX_COMMIT}"
          )

          [ "${#ALL_COMMITS[@]}" -gt 0 ] || {
            echo "ERROR: No commits between official and LX."
            exit 1
          }

          APPLIED_COUNT=0

          for COMMIT in "${ALL_COMMITS[@]}"; do
            mapfile -t CHANGED_FILES < <(
              git diff-tree \
                --no-commit-id \
                --name-only \
                -r \
                "$COMMIT"
            )

            [ "${#CHANGED_FILES[@]}" -gt 0 ] || continue

            IS_XHTTP=0

            for FILE in "${CHANGED_FILES[@]}"; do
              case "$FILE" in
                common/badh2/*)
                  IS_XHTTP=1
                  ;;
                include/v2rayxhttp.go)
                  IS_XHTTP=1
                  ;;
                option/v2ray_xhttp*.go)
                  IS_XHTTP=1
                  ;;
                transport/v2rayxhttp/*)
                  IS_XHTTP=1
                  ;;
              esac
            done

            if [ "$IS_XHTTP" -eq 0 ]; then
              PATCH_TEXT="$(
                git show \
                  --format= \
                  --no-ext-diff \
                  --unified=0 \
                  "$COMMIT" \
                  -- \
                  constant/v2ray.go \
                  option/v2ray_transport.go \
                  transport/v2ray/registry.go \
                  transport/v2ray/transport.go
              )"

              if printf '%s\n' "$PATCH_TEXT" |
                grep -Eq 'V2RayTransportTypeXHTTP|XHTTPOptions|v2rayxhttp|v2ray_xhttp|with_xhttp|XHTTP'; then
                IS_XHTTP=1
              fi
            fi

            [ "$IS_XHTTP" -eq 1 ] || continue

            SUBJECT="$(git show -s --format='%s' "$COMMIT")"

            echo
            echo "=================================================="
            echo "XHTTP commit: ${COMMIT}"
            echo "Subject: ${SUBJECT}"
            echo "=================================================="

            echo "Changed files:"
            printf '  %s\n' "${CHANGED_FILES[@]}"

            rm -f "$XHTTP_PATCH"

            git show \
              --format= \
              --binary \
              "$COMMIT" \
              -- \
              ':(glob)common/badh2/**' \
              include/v2rayxhttp.go \
              ':(glob)option/v2ray_xhttp*.go' \
              ':(glob)transport/v2rayxhttp/**' \
              constant/v2ray.go \
              option/v2ray_transport.go \
              transport/v2ray/registry.go \
              transport/v2ray/transport.go \
              > "$XHTTP_PATCH"

            if [ ! -s "$XHTTP_PATCH" ]; then
              echo "No XHTTP code patch in ${COMMIT}, skipping."
              continue
            fi

            BEFORE="$(git rev-parse HEAD)"

            if ! git apply \
              --3way \
              --index \
              "$XHTTP_PATCH"; then

              echo
              echo "ERROR: XHTTP patch could not be applied."
              echo "Commit: ${COMMIT}"
              echo "Subject: ${SUBJECT}"
              echo
              echo "Resetting to:"
              echo "  ${BEFORE}"

              git reset --hard "$BEFORE"
              exit 1
            fi

            git reset

            echo "${COMMIT} ${SUBJECT}" >> "$XHTTP_APPLIED"
            APPLIED_COUNT=$((APPLIED_COUNT + 1))

            echo "Applied XHTTP patch successfully."
          done

          echo
          echo "=================================================="
          echo "XHTTP import completed"
          echo "=================================================="

          echo "Applied XHTTP commits: ${APPLIED_COUNT}"

          if [ "$APPLIED_COUNT" -eq 0 ]; then
            echo "ERROR: No XHTTP commits were applied."
            exit 1
          fi

          echo
          echo "Applied commits:"
          cat "$XHTTP_APPLIED"

          echo
          echo "Final changed files:"
          git diff --name-only "$OFFICIAL_COMMIT"

          mapfile -t FINAL_FILES < <(
            git diff --name-only "$OFFICIAL_COMMIT"
          )

          for FILE in "${FINAL_FILES[@]}"; do
            if [[ ! "$FILE" =~ $ALLOWED_REGEX ]]; then
              echo
              echo "ERROR: Unexpected file changed:"
              echo "  ${FILE}"
              exit 1
            fi
          done

          echo
          echo "Allowed XHTTP file verification passed."

          test -f option/v2ray_xhttp.go
          test -f option/v2ray_xhttp_xmux_range.go
          test -f include/v2rayxhttp.go
          test -d transport/v2rayxhttp
          test -d common/badh2

          echo
          echo "Required XHTTP files verified."

      - name: Verify no unrelated LX features
        shell: bash
        run: |
          set -euo pipefail

          OFFICIAL_COMMIT="$(git rev-parse HEAD~0)"

          echo "Checking working tree..."

          git status --short

          echo
          echo "XHTTP-related source files:"

          find \
            common/badh2 \
            transport/v2rayxhttp \
            option \
            include \
            constant \
            transport/v2ray \
            -maxdepth 3 \
            -type f \
            \( \
              -path '*/badh2/*' -o \
              -path '*/v2rayxhttp/*' -o \
              -name 'v2ray_xhttp.go' -o \
              -name 'v2ray_xhttp_xmux_range.go' -o \
              -name 'v2ray_xhttp_xmux_range_test.go' -o \
              -name 'v2rayxhttp.go' \
            \) \
            2>/dev/null |
            sort || true

          echo
          echo "Unrelated LX feature paths are not intentionally imported."

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.8"
          cache: true

      - name: Build sing-box
        shell: bash
        env:
          CGO_ENABLED: "0"
          GOOS: linux
        run: |
          set -euxo pipefail

          if [ "${{ matrix.arch }}" = "amd64" ]; then
            GOARCH=amd64
          else
            GOARCH=arm64
          fi

          OFFICIAL_VERSION="${{ needs.get-version.outputs.upstream_version }}"
          LX_TAG="${{ needs.get-version.outputs.lx_tag }}"

          OFFICIAL_TAGS="$(
            tr '\n' ',' < release/DEFAULT_BUILD_TAGS |
            sed 's/,$//'
          )"

          TAGS="${OFFICIAL_TAGS},with_purego,with_xhttp,with_v2ray_api"

          LDFLAGS_SHARED="$(cat release/LDFLAGS)"

          echo "Official version: v${OFFICIAL_VERSION}"
          echo "LX version: ${LX_TAG}"
          echo "Architecture: ${GOARCH}"
          echo "Build tags: ${TAGS}"
          echo "LDFLAGS: ${LDFLAGS_SHARED}"

          go mod download

          go build -v -trimpath \
            -o "sing-box-linux-${{ matrix.arch }}" \
            -tags "${TAGS}" \
            -ldflags "-X 'github.com/sagernet/sing-box/constant.Version=${OFFICIAL_VERSION}' ${LDFLAGS_SHARED} -s -w -buildid=" \
            ./cmd/sing-box

      - name: Check build
        shell: bash
        run: |
          set -euxo pipefail

          chmod +x "sing-box-linux-${{ matrix.arch }}"

          "./sing-box-linux-${{ matrix.arch }}" version

          echo
          echo "Binary information:"
          ls -lh "sing-box-linux-${{ matrix.arch }}"
          file "sing-box-linux-${{ matrix.arch }}"

      - name: Upload Artifact
        uses: actions/upload-artifact@v5
        with:
          name: sing-box-${{ needs.get-version.outputs.upstream_version }}-xhttp-v2rayapi-linux-${{ matrix.arch }}
          path: sing-box-linux-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 90

  release:
    needs:
      - get-version
      - build
    runs-on: ubuntu-24.04

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v5
        with:
          path: release-files

      - name: Prepare release files
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p release

          find release-files \
            -type f \
            -name 'sing-box-linux-amd64' \
            -exec cp {} release/sing-box-linux-amd64 \;

          find release-files \
            -type f \
            -name 'sing-box-linux-arm64' \
            -exec cp {} release/sing-box-linux-arm64 \;

          test -f release/sing-box-linux-amd64
          test -f release/sing-box-linux-arm64

          chmod +x \
            release/sing-box-linux-amd64 \
            release/sing-box-linux-arm64

          echo "Release files:"
          ls -lh release

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.get-version.outputs.upstream_version }}-xhttp-v2rayapi
          name: sing-box v${{ needs.get-version.outputs.upstream_version }} XHTTP + V2Ray API
          make_latest: false
          generate_release_notes: false
          body: |
            Based on official SagerNet/sing-box v${{ needs.get-version.outputs.upstream_version }}

            XHTTP source:
            Leadaxe/sing-box-lx ${{ needs.get-version.outputs.lx_tag }}

            Build:
            - Official sing-box feature set preserved
            - Added with_purego
            - Added with_xhttp
            - Added with_v2ray_api

            Architectures:
            - Linux amd64
            - Linux arm64

            LX-only features such as AWG, lx_command, lxd, lx_chain and MASQUE are not intentionally included.

            XHTTP is imported from the LX history as filtered source patches.
            Only XHTTP-related files are allowed to modify the official source tree.

          files: |
            release/sing-box-linux-amd64
            release/sing-box-linux-arm64

          fail_on_unmatched_files: true
