name: Build sing-box

on:
  workflow_dispatch:
  schedule:
    - cron: "30 2 * * *"

permissions:
  contents: write

jobs:
  get-version:
    runs-on: ubuntu-24.04
    outputs:
      upstream_version: ${{ steps.version.outputs.upstream_version }}
    steps:
      - name: Get latest official stable version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          UPSTREAM_VERSION="$(
            curl -fsSL https://api.github.com/repos/SagerNet/sing-box/releases/latest |
            jq -r '.tag_name' |
            sed 's/^v//'
          )"

          [ -n "$UPSTREAM_VERSION" ] || {
            echo "Failed to detect latest official sing-box version"
            exit 1
          }

          echo "upstream_version=${UPSTREAM_VERSION}" >> "$GITHUB_OUTPUT"

          echo "Official sing-box: v${UPSTREAM_VERSION}"

  build:
    needs: get-version
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        arch:
          - amd64
          - arm64

    steps:
      - name: Checkout official sing-box
        uses: actions/checkout@v5
        with:
          repository: SagerNet/sing-box
          ref: v${{ needs.get-version.outputs.upstream_version }}
          fetch-depth: 1
          submodules: recursive

      - name: Import sing-xhttp
        shell: bash
        run: |
          set -euo pipefail

          XHTTP_VERSION="v0.1.6"

          echo "Downloading sing-xhttp ${XHTTP_VERSION}..."

          mkdir -p transport/v2ray

          curl -fsSL \
            "https://raw.githubusercontent.com/justinwoo280/sing-xhttp/${XHTTP_VERSION}/xhttp/adapter.go" \
            -o /tmp/xhttp_adapter.go

          test -s /tmp/xhttp_adapter.go

          echo
          echo "sing-xhttp adapter:"
          sed -n '1,240p' /tmp/xhttp_adapter.go

          echo
          echo "Adding dependency..."

          go get "github.com/justinwoo280/sing-xhttp@${XHTTP_VERSION}"

          echo
          echo "Dependency added."

      - name: Add XHTTP constant
        shell: bash
        run: |
          set -euo pipefail

          FILE="constant/v2ray.go"

          grep -q 'V2RayTransportTypeXHTTP' "$FILE" && {
            echo "XHTTP constant already exists."
            exit 0
          }

          python3 - <<'PY'
          from pathlib import Path

          path = Path("constant/v2ray.go")
          text = path.read_text()

          marker = 'V2RayTransportTypeHTTP = "http"'

          if marker not in text:
              raise SystemExit("Could not find V2Ray HTTP transport constant")

          text = text.replace(
              marker,
              marker + '\n\tV2RayTransportTypeXHTTP = "xhttp"',
              1,
          )

          path.write_text(text)
          PY

          grep -n 'V2RayTransportTypeXHTTP' "$FILE"

      - name: Add XHTTP options
        shell: bash
        run: |
          set -euo pipefail

          FILE="option/v2ray_transport.go"

          grep -q 'XHTTPOptions' "$FILE" && {
            echo "XHTTP options already exist."
            exit 0
          }

          python3 - <<'PY'
          from pathlib import Path

          path = Path("option/v2ray_transport.go")
          text = path.read_text()

          if 'github.com/justinwoo280/sing-xhttp/xhttp' not in text:
              imports = 'import (\n'
              pos = text.find(imports)

              if pos == -1:
                  raise SystemExit("Import block not found")

              text = text[:pos] + (
                  'import (\n'
                  '\t"github.com/justinwoo280/sing-xhttp/xhttp"\n'
              ) + text[pos + len(imports):]

          struct_marker = 'type V2RayTransportOptions struct {'

          if struct_marker not in text:
              raise SystemExit("V2RayTransportOptions not found")

          pos = text.find(struct_marker)

          brace = text.find("{", pos)

          text = (
              text[:brace + 1]
              + '\n\tXHTTPOptions *xhttp.Options `json:"xhttp,omitempty"`'
              + text[brace + 1:]
          )

          path.write_text(text)
          PY

          grep -n 'XHTTPOptions' "$FILE"

      - name: Add XHTTP JSON parsing
        shell: bash
        run: |
          set -euo pipefail

          FILE="option/v2ray_transport.go"

          python3 - <<'PY'
          from pathlib import Path

          path = Path("option/v2ray_transport.go")
          text = path.read_text()

          if 'case C.V2RayTransportTypeXHTTP:' in text:
              print("XHTTP JSON cases already exist.")
              raise SystemExit(0)

          unmarshal_marker = 'switch transport.Type {'

          if unmarshal_marker not in text:
              raise SystemExit("Transport type switch not found")

          first = text.find(unmarshal_marker)

          insert = '''
          \tcase C.V2RayTransportTypeXHTTP:
          \t\tif transport.XHTTPOptions == nil {
          \t\t\ttransport.XHTTPOptions = new(xhttp.Options)
          \t\t}
          \t\tif err := json.Unmarshal(raw, transport.XHTTPOptions); err != nil {
          \t\t\treturn err
          \t\t}
          '''

          text = text[:first] + text[first:].replace(
              unmarshal_marker,
              unmarshal_marker + insert,
              1,
          )

          path.write_text(text)
          PY

          grep -n -A8 -B3 'V2RayTransportTypeXHTTP' "$FILE"

      - name: Add XHTTP transport bridge
        shell: bash
        run: |
          set -euo pipefail

          FILE="transport/v2ray/xhttp.go"

          cat > "$FILE" <<'EOF'
          package v2ray

          import (
              "context"

              "github.com/sagernet/sing-box/adapter"
              C "github.com/sagernet/sing-box/constant"
              "github.com/sagernet/sing-box/option"

              "github.com/justinwoo280/sing-xhttp/xhttp"
          )

          func newXHTTPServerTransport(
              ctx context.Context,
              options *option.V2RayTransportOptions,
          ) (adapter.V2RayServerTransport, error) {
              if options == nil || options.XHTTPOptions == nil {
                  return nil, xhttp.ErrInvalidOptions
              }

              return xhttp.NewServer(ctx, options.XHTTPOptions)
          }

          func newXHTTPClientTransport(
              ctx context.Context,
              options *option.V2RayTransportOptions,
          ) (adapter.V2RayClientTransport, error) {
              if options == nil || options.XHTTPOptions == nil {
                  return nil, xhttp.ErrInvalidOptions
              }

              return xhttp.NewClient(ctx, options.XHTTPOptions)
          }

          var _ = C.V2RayTransportTypeXHTTP
          EOF

          gofmt -w "$FILE"

          cat "$FILE"

      - name: Patch V2Ray server transport
        shell: bash
        run: |
          set -euo pipefail

          FILE="transport/v2ray/transport.go"

          python3 - <<'PY'
          from pathlib import Path

          path = Path("transport/v2ray/transport.go")
          text = path.read_text()

          if 'case C.V2RayTransportTypeXHTTP:' in text:
              print("XHTTP server/client cases already exist.")
              raise SystemExit(0)

          server_marker = 'func NewServerTransport('

          if server_marker not in text:
              raise SystemExit("NewServerTransport not found")

          server_pos = text.find(server_marker)
          switch_pos = text.find("switch options.Type", server_pos)

          if switch_pos == -1:
              switch_pos = text.find("switch transport.Type", server_pos)

          if switch_pos == -1:
              raise SystemExit("Server transport switch not found")

          brace = text.find("{", switch_pos)

          server_case = '''
          \n\tcase C.V2RayTransportTypeXHTTP:
          \t\treturn newXHTTPServerTransport(ctx, options)
          '''

          text = text[:brace + 1] + server_case + text[brace + 1:]

          client_marker = 'func NewClientTransport('

          if client_marker not in text:
              raise SystemExit("NewClientTransport not found")

          client_pos = text.find(client_marker)
          client_switch = text.find("switch options.Type", client_pos)

          if client_switch == -1:
              client_switch = text.find("switch transport.Type", client_pos)

          if client_switch == -1:
              raise SystemExit("Client transport switch not found")

          client_brace = text.find("{", client_switch)

          client_case = '''
          \n\tcase C.V2RayTransportTypeXHTTP:
          \t\treturn newXHTTPClientTransport(ctx, options)
          '''

          text = text[:client_brace + 1] + client_case + text[client_brace + 1:]

          path.write_text(text)
          PY

          gofmt -w "$FILE"

          grep -n -A5 -B3 'V2RayTransportTypeXHTTP' "$FILE"

      - name: Verify XHTTP integration source
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking XHTTP integration..."

          grep -R \
            -n \
            -E \
            'V2RayTransportTypeXHTTP|XHTTPOptions|NewServer|NewClient' \
            constant/v2ray.go \
            option/v2ray_transport.go \
            transport/v2ray/xhttp.go \
            transport/v2ray/transport.go

          echo
          echo "Checking dependency..."

          go list -m github.com/justinwoo280/sing-xhttp

          echo
          echo "XHTTP source verification completed."

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.8"
          cache: true

      - name: Build sing-box
        shell: bash
        env:
          CGO_ENABLED: "0"
          GOOS: linux
        run: |
          set -euxo pipefail

          if [ "${{ matrix.arch }}" = "amd64" ]; then
            GOARCH=amd64
          else
            GOARCH=arm64
          fi

          OFFICIAL_VERSION="${{ needs.get-version.outputs.upstream_version }}"

          OFFICIAL_TAGS="$(
            tr '\n' ',' < release/DEFAULT_BUILD_TAGS |
            sed 's/,$//'
          )"

          TAGS="${OFFICIAL_TAGS},with_purego,with_v2ray_api"

          LDFLAGS_SHARED="$(cat release/LDFLAGS)"

          echo "Official version: v${OFFICIAL_VERSION}"
          echo "Architecture: ${GOARCH}"
          echo "Build tags: ${TAGS}"
          echo "LDFLAGS: ${LDFLAGS_SHARED}"

          go mod tidy
          go mod download

          go build -v -trimpath \
            -o "sing-box-linux-${{ matrix.arch }}" \
            -tags "${TAGS}" \
            -ldflags "-X 'github.com/sagernet/sing-box/constant.Version=${OFFICIAL_VERSION}' ${LDFLAGS_SHARED} -s -w -buildid=" \
            ./cmd/sing-box

      - name: Check build and XHTTP
        shell: bash
        run: |
          set -euxo pipefail

          chmod +x "sing-box-linux-${{ matrix.arch }}"

          "./sing-box-linux-${{ matrix.arch }}" version

          echo
          echo "Checking XHTTP symbols..."

          strings "sing-box-linux-${{ matrix.arch }}" |
            grep -E 'sing-xhttp|xhttp|V2RayTransportTypeXHTTP' |
            head -n 100 || true

          echo
          echo "Binary information:"

          ls -lh "sing-box-linux-${{ matrix.arch }}"

          file "sing-box-linux-${{ matrix.arch }}"

      - name: Test XHTTP inbound and outbound configuration
        shell: bash
        run: |
          set -euo pipefail

          cat > /tmp/xhttp-test.json <<'EOF'
          {
            "inbounds": [
              {
                "type": "vless",
                "tag": "xhttp-in",
                "listen": "127.0.0.1",
                "listen_port": 18443,
                "users": [
                  {
                    "name": "xhttp-test",
                    "uuid": "8a21b0ab-c9a6-4763-bbc5-9a170a8a1869"
                  }
                ],
                "transport": {
                  "type": "xhttp",
                  "mode": "packet-up",
                  "path": "/xhttp"
                }
              }
            ],
            "outbounds": [
              {
                "type": "vless",
                "tag": "xhttp-out",
                "server": "127.0.0.1",
                "server_port": 18443,
                "uuid": "8a21b0ab-c9a6-4763-bbc5-9a170a8a1869",
                "transport": {
                  "type": "xhttp",
                  "mode": "packet-up",
                  "path": "/xhttp"
                }
              }
            ]
          }
          EOF

          echo "Testing XHTTP inbound + outbound..."

          "./sing-box-linux-${{ matrix.arch }}" \
            check \
            -c /tmp/xhttp-test.json

          echo
          echo "XHTTP inbound/outbound configuration check passed."

      - name: Upload Artifact
        uses: actions/upload-artifact@v5
        with:
          name: sing-box-${{ needs.get-version.outputs.upstream_version }}-xhttp-v2rayapi-linux-${{ matrix.arch }}
          path: sing-box-linux-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 90

  release:
    needs:
      - get-version
      - build
    runs-on: ubuntu-24.04

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v5
        with:
          path: release-files

      - name: Prepare release files
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p release

          find release-files \
            -type f \
            -name 'sing-box-linux-amd64' \
            -exec cp {} release/sing-box-linux-amd64 \;

          find release-files \
            -type f \
            -name 'sing-box-linux-arm64' \
            -exec cp {} release/sing-box-linux-arm64 \;

          test -f release/sing-box-linux-amd64
          test -f release/sing-box-linux-arm64

          chmod +x \
            release/sing-box-linux-amd64 \
            release/sing-box-linux-arm64

          tar -czf \
            release/sing-box-linux-amd64.tar.gz \
            -C release \
            sing-box-linux-amd64

          tar -czf \
            release/sing-box-linux-arm64.tar.gz \
            -C release \
            sing-box-linux-arm64

          rm -f \
            release/sing-box-linux-amd64 \
            release/sing-box-linux-arm64

          ls -lh release

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.get-version.outputs.upstream_version }}-xhttp-v2rayapi
          name: sing-box v${{ needs.get-version.outputs.upstream_version }} XHTTP + V2Ray API
          make_latest: false
          generate_release_notes: false
          body: |
            Based on official SagerNet/sing-box v${{ needs.get-version.outputs.upstream_version }}

            XHTTP:
            github.com/justinwoo280/sing-xhttp v0.1.6

            Build:
            - Official sing-box feature set preserved
            - Added with_purego
            - Added XHTTP Server
            - Added XHTTP Client
            - Added with_v2ray_api

            XHTTP:
            - VLESS inbound + XHTTP
            - VLESS outbound + XHTTP
            - Server + Client
            - Compatible with Xray XHTTP wire format

            Architectures:
            - Linux amd64
            - Linux arm64

            LX-only features are not included.

          files: |
            release/sing-box-linux-amd64.tar.gz
            release/sing-box-linux-arm64.tar.gz

          fail_on_unmatched_files: true
