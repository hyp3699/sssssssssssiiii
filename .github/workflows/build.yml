name: Build sing-box

on:
  workflow_dispatch:
  schedule:
    - cron: "30 2 * * *"

permissions:
  contents: write

jobs:
  get-version:
    runs-on: ubuntu-24.04
    outputs:
      upstream_version: ${{ steps.version.outputs.upstream_version }}
      lx_tag: ${{ steps.version.outputs.lx_tag }}
    steps:
      - name: Get latest stable versions
        id: version
        shell: bash
        run: |
          set -euo pipefail

          UPSTREAM_VERSION="$(
            curl -fsSL https://api.github.com/repos/SagerNet/sing-box/releases/latest |
            jq -r '.tag_name' |
            sed 's/^v//'
          )"

          [ -n "$UPSTREAM_VERSION" ] || {
            echo "Failed to detect latest official sing-box version"
            exit 1
          }

          LX_TAG="$(
            git ls-remote --tags --refs \
              https://github.com/Leadaxe/sing-box-lx.git \
              "refs/tags/v${UPSTREAM_VERSION}-lx.*" |
            awk -F/ '{print $3}' |
            sort -V |
            tail -n1
          )"

          [ -n "$LX_TAG" ] || {
            echo "No matching sing-box-lx tag found for v${UPSTREAM_VERSION}"
            exit 1
          }

          echo "upstream_version=${UPSTREAM_VERSION}" >> "$GITHUB_OUTPUT"
          echo "lx_tag=${LX_TAG}" >> "$GITHUB_OUTPUT"

          echo "Official: v${UPSTREAM_VERSION}"
          echo "LX: ${LX_TAG}"

  build:
    needs: get-version
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        arch:
          - amd64
          - arm64

    steps:
      - name: Checkout official sing-box
        uses: actions/checkout@v5
        with:
          repository: SagerNet/sing-box
          ref: v${{ needs.get-version.outputs.upstream_version }}
          fetch-depth: 1
          submodules: recursive

      - name: Fetch matching sing-box-lx
        shell: bash
        run: |
          set -euxo pipefail

          git remote add lx https://github.com/Leadaxe/sing-box-lx.git

          git fetch \
            --filter=blob:none \
            --no-tags \
            lx \
            "refs/tags/${{ needs.get-version.outputs.lx_tag }}:refs/remotes/lx/${{ needs.get-version.outputs.lx_tag }}"

          LX_COMMIT="$(git rev-parse refs/remotes/lx/${{ needs.get-version.outputs.lx_tag }})"

          echo "LX commit: ${LX_COMMIT}"

      - name: Import XHTTP with three-way file merge
        shell: bash
        run: |
          set -euo pipefail

          OFFICIAL_COMMIT="$(git rev-parse HEAD)"
          LX_COMMIT="$(git rev-parse refs/remotes/lx/${{ needs.get-version.outputs.lx_tag }})"

          echo "Official commit:"
          echo "  ${OFFICIAL_COMMIT}"

          echo "LX commit:"
          echo "  ${LX_COMMIT}"

          if ! git merge-base --is-ancestor "$OFFICIAL_COMMIT" "$LX_COMMIT"; then
            echo "ERROR: LX tag is not based on the official version."
            exit 1
          fi

          WORK="/tmp/singbox-xhttp"
          rm -rf "$WORK"
          mkdir -p "$WORK"

          XHTTP_COMMITS_FILE="$WORK/xhttp-commits"

          : > "$XHTTP_COMMITS_FILE"

          echo "Scanning LX history..."

          mapfile -t ALL_COMMITS < <(
            git rev-list \
              --reverse \
              "${OFFICIAL_COMMIT}..${LX_COMMIT}"
          )

          [ "${#ALL_COMMITS[@]}" -gt 0 ] || {
            echo "ERROR: No LX commits found."
            exit 1
          }

          for COMMIT in "${ALL_COMMITS[@]}"; do
            mapfile -t FILES < <(
              git diff-tree \
                --no-commit-id \
                --name-only \
                -r \
                "$COMMIT"
            )

            [ "${#FILES[@]}" -gt 0 ] || continue

            IS_XHTTP=0

            for FILE in "${FILES[@]}"; do
              case "$FILE" in
                common/badh2/*)
                  IS_XHTTP=1
                  ;;
                include/v2rayxhttp.go)
                  IS_XHTTP=1
                  ;;
                option/v2ray_xhttp*.go)
                  IS_XHTTP=1
                  ;;
                transport/v2rayxhttp/*)
                  IS_XHTTP=1
                  ;;
              esac
            done

            if [ "$IS_XHTTP" -eq 0 ]; then
              PATCH_TEXT="$(
                git show \
                  --format= \
                  --unified=0 \
                  "$COMMIT" \
                  -- \
                  constant/v2ray.go \
                  option/v2ray_transport.go \
                  transport/v2ray/registry.go \
                  transport/v2ray/transport.go
              )"

              if printf '%s\n' "$PATCH_TEXT" |
                grep -Eq \
                'V2RayTransportTypeXHTTP|XHTTPOptions|v2rayxhttp|v2ray_xhttp|with_xhttp|XmuxRange'; then
                IS_XHTTP=1
              fi
            fi

            if [ "$IS_XHTTP" -eq 1 ]; then
              SUBJECT="$(git show -s --format='%s' "$COMMIT")"

              echo "${COMMIT}|${SUBJECT}" >> "$XHTTP_COMMITS_FILE"
            fi
          done

          XHTTP_COUNT="$(wc -l < "$XHTTP_COMMITS_FILE")"

          echo
          echo "XHTTP commits found: ${XHTTP_COUNT}"

          [ "$XHTTP_COUNT" -gt 0 ] || {
            echo "ERROR: No XHTTP commits found."
            exit 1
          }

          cat "$XHTTP_COMMITS_FILE"

          ALLOWED_REGEX='^(common/badh2/|include/v2rayxhttp\.go$|option/v2ray_xhttp.*\.go$|transport/v2rayxhttp/|constant/v2ray\.go$|option/v2ray_transport\.go$|transport/v2ray/(registry|transport)\.go$)'

          APPLIED=0

          while IFS='|' read -r COMMIT SUBJECT; do

            echo
            echo "=================================================="
            echo "Applying XHTTP commit"
            echo "Commit : ${COMMIT}"
            echo "Subject: ${SUBJECT}"
            echo "=================================================="

            PARENT="$(git rev-parse "${COMMIT}^")"

            mapfile -t COMMIT_FILES < <(
              git diff-tree \
                --no-commit-id \
                --name-only \
                -r \
                "$COMMIT"
            )

            for FILE in "${COMMIT_FILES[@]}"; do

              if [[ ! "$FILE" =~ $ALLOWED_REGEX ]]; then
                continue
              fi

              echo
              echo "Processing:"
              echo "  ${FILE}"

              CURRENT="$WORK/current"
              BASE="$WORK/base"
              THEIRS="$WORK/theirs"
              RESULT="$WORK/result"

              rm -f \
                "$CURRENT" \
                "$BASE" \
                "$THEIRS" \
                "$RESULT"

              if [ -f "$FILE" ]; then
                cp "$FILE" "$CURRENT"
              else
                : > "$CURRENT"
              fi

              if git cat-file -e "${PARENT}:${FILE}" 2>/dev/null; then
                git show "${PARENT}:${FILE}" > "$BASE"
              else
                : > "$BASE"
              fi

              if git cat-file -e "${COMMIT}:${FILE}" 2>/dev/null; then
                git show "${COMMIT}:${FILE}" > "$THEIRS"
              else
                : > "$THEIRS"
              fi

              BASE_SIZE="$(wc -c < "$BASE")"
              THEIRS_SIZE="$(wc -c < "$THEIRS")"
              CURRENT_SIZE="$(wc -c < "$CURRENT")"

              if [ "$BASE_SIZE" -eq 0 ] && [ "$THEIRS_SIZE" -gt 0 ]; then
                echo "New file from LX:"
                echo "  ${FILE}"

                mkdir -p "$(dirname "$FILE")"
                cp "$THEIRS" "$FILE"
                continue
              fi

              if [ "$THEIRS_SIZE" -eq 0 ]; then
                echo "LX deleted:"
                echo "  ${FILE}"

                rm -f "$FILE"
                continue
              fi

              if [ "$CURRENT_SIZE" -eq 0 ]; then
                echo "Official file does not exist; using LX version:"
                echo "  ${FILE}"

                mkdir -p "$(dirname "$FILE")"
                cp "$THEIRS" "$FILE"
                continue
              fi

              if cmp -s "$CURRENT" "$BASE"; then
                echo "Official file unchanged from LX base."
                echo "Using LX version."

                cp "$THEIRS" "$FILE"
                continue
              fi

              if cmp -s "$BASE" "$THEIRS"; then
                echo "LX made no effective change."
                continue
              fi

              echo "Three-way merging:"
              echo "  Ours  = official current"
              echo "  Base  = LX parent"
              echo "  Theirs = LX XHTTP commit"

              if ! git merge-file \
                -p \
                "$CURRENT" \
                "$BASE" \
                "$THEIRS" \
                > "$RESULT"; then

                echo
                echo "ERROR: Three-way merge failed."
                echo "Commit: ${COMMIT}"
                echo "File: ${FILE}"

                echo
                echo "Conflict markers:"
                grep -n \
                  -E \
                  '^(<<<<<<<|=======|>>>>>>>)' \
                  "$RESULT" || true

                exit 1
              fi

              if grep -q \
                -E \
                '^(<<<<<<<|=======|>>>>>>>)' \
                "$RESULT"; then

                echo
                echo "ERROR: Unresolved merge conflict:"
                echo "  ${FILE}"
                exit 1
              fi

              cp "$RESULT" "$FILE"

              echo "Merged successfully:"
              echo "  ${FILE}"

            done

            APPLIED=$((APPLIED + 1))

          done < "$XHTTP_COMMITS_FILE"

          echo
          echo "=================================================="
          echo "XHTTP import completed"
          echo "=================================================="

          echo "Applied commits: ${APPLIED}"

          echo
          echo "Changed files:"
          git status --short

          echo
          echo "Diffstat:"
          git diff --stat "$OFFICIAL_COMMIT"

          mapfile -t FINAL_FILES < <(
            git diff --name-only "$OFFICIAL_COMMIT"
          )

          for FILE in "${FINAL_FILES[@]}"; do
            if [[ ! "$FILE" =~ $ALLOWED_REGEX ]]; then
              echo
              echo "ERROR: Unexpected file changed:"
              echo "  ${FILE}"
              exit 1
            fi
          done

          echo
          echo "Final XHTTP file whitelist check passed."

          test -f option/v2ray_xhttp.go
          test -f option/v2ray_xhttp_xmux_range.go
          test -f include/v2rayxhttp.go
          test -d transport/v2rayxhttp
          test -d common/badh2

          echo
          echo "Required XHTTP files verified."

      - name: Verify XHTTP symbols
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking XHTTP source..."

          grep -R \
            -n \
            -E \
            'V2RayTransportTypeXHTTP|XmuxRange|v2rayxhttp' \
            option \
            constant \
            transport/v2ray \
            transport/v2rayxhttp \
            include \
            2>/dev/null |
            head -n 100 || true

          echo
          echo "XHTTP source check completed."

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.8"
          cache: true

      - name: Build sing-box
        shell: bash
        env:
          CGO_ENABLED: "0"
          GOOS: linux
        run: |
          set -euxo pipefail

          if [ "${{ matrix.arch }}" = "amd64" ]; then
            GOARCH=amd64
          else
            GOARCH=arm64
          fi

          OFFICIAL_VERSION="${{ needs.get-version.outputs.upstream_version }}"
          LX_TAG="${{ needs.get-version.outputs.lx_tag }}"

          OFFICIAL_TAGS="$(
            tr '\n' ',' < release/DEFAULT_BUILD_TAGS |
            sed 's/,$//'
          )"

          TAGS="${OFFICIAL_TAGS},with_purego,with_xhttp,with_v2ray_api"

          LDFLAGS_SHARED="$(cat release/LDFLAGS)"

          echo "Official version: v${OFFICIAL_VERSION}"
          echo "LX version: ${LX_TAG}"
          echo "Architecture: ${GOARCH}"
          echo "Build tags: ${TAGS}"
          echo "LDFLAGS: ${LDFLAGS_SHARED}"

          go mod download

          go build -v -trimpath \
            -o "sing-box-linux-${{ matrix.arch }}" \
            -tags "${TAGS}" \
            -ldflags "-X 'github.com/sagernet/sing-box/constant.Version=${OFFICIAL_VERSION}' ${LDFLAGS_SHARED} -s -w -buildid=" \
            ./cmd/sing-box

      - name: Check build
        shell: bash
        run: |
          set -euxo pipefail

          chmod +x "sing-box-linux-${{ matrix.arch }}"

          "./sing-box-linux-${{ matrix.arch }}" version

          echo
          echo "Binary information:"
          ls -lh "sing-box-linux-${{ matrix.arch }}"
          file "sing-box-linux-${{ matrix.arch }}"

      - name: Upload Artifact
        uses: actions/upload-artifact@v5
        with:
          name: sing-box-${{ needs.get-version.outputs.upstream_version }}-xhttp-v2rayapi-linux-${{ matrix.arch }}
          path: sing-box-linux-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 90

  release:
    needs:
      - get-version
      - build
    runs-on: ubuntu-24.04

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v5
        with:
          path: release-files

      - name: Prepare release files
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p release

          find release-files \
            -type f \
            -name 'sing-box-linux-amd64' \
            -exec cp {} release/sing-box-linux-amd64 \;

          find release-files \
            -type f \
            -name 'sing-box-linux-arm64' \
            -exec cp {} release/sing-box-linux-arm64 \;

          test -f release/sing-box-linux-amd64
          test -f release/sing-box-linux-arm64

          chmod +x \
            release/sing-box-linux-amd64 \
            release/sing-box-linux-arm64

          ls -lh release

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.get-version.outputs.upstream_version }}-xhttp-v2rayapi
          name: sing-box v${{ needs.get-version.outputs.upstream_version }} XHTTP + V2Ray API
          make_latest: false
          generate_release_notes: false
          body: |
            Based on official SagerNet/sing-box v${{ needs.get-version.outputs.upstream_version }}

            XHTTP source:
            Leadaxe/sing-box-lx ${{ needs.get-version.outputs.lx_tag }}

            Build:
            - Official sing-box feature set preserved
            - Added with_purego
            - Added with_xhttp
            - Added with_v2ray_api

            Architectures:
            - Linux amd64
            - Linux arm64

            LX-only features such as AWG, lx_command, lxd, lx_chain and MASQUE are not intentionally included.

            XHTTP is imported using three-way file merging from the LX XHTTP history.

          files: |
            release/sing-box-linux-amd64
            release/sing-box-linux-arm64

          fail_on_unmatched_files: true
