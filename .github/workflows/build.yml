name: Build sing-box

on:
  workflow_dispatch:
  schedule:
    - cron: "30 2 * * *"

permissions:
  contents: write

jobs:
  get-version:
    runs-on: ubuntu-24.04
    outputs:
      upstream_version: ${{ steps.version.outputs.upstream_version }}

    steps:
      - name: Get latest official version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          UPSTREAM_VERSION="$(
            curl -fsSL https://api.github.com/repos/SagerNet/sing-box/releases/latest |
            jq -r '.tag_name' |
            sed 's/^v//'
          )"

          [ -n "$UPSTREAM_VERSION" ] || {
            echo "Failed to detect latest official sing-box version"
            exit 1
          }

          echo "upstream_version=${UPSTREAM_VERSION}" >> "$GITHUB_OUTPUT"

          echo "Official sing-box: v${UPSTREAM_VERSION}"

  build:
    needs: get-version
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        arch:
          - amd64
          - arm64

    steps:
      - name: Checkout official sing-box
        uses: actions/checkout@v5
        with:
          repository: SagerNet/sing-box
          ref: v${{ needs.get-version.outputs.upstream_version }}
          fetch-depth: 1
          submodules: recursive

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.8"
          cache: true

      - name: Verify supported sing-box source
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${{ needs.get-version.outputs.upstream_version }}"

          if [ "$VERSION" != "1.14.1" ]; then
            echo "ERROR: This XHTTP integration is currently prepared for sing-box v1.14.1."
            echo "Detected: v${VERSION}"
            echo "Do not build against an unverified sing-box source tree."
            exit 1
          fi

          test -f constant/v2ray.go
          test -f option/v2ray_transport.go
          test -f transport/v2ray/transport.go

          echo "Verified sing-box v${VERSION}"

      - name: Add sing-xhttp
        shell: bash
        run: |
          set -euo pipefail

          XHTTP_VERSION="v0.1.6"

          echo "Adding sing-xhttp ${XHTTP_VERSION}"

          go mod edit \
            -require=github.com/justinwoo280/sing-xhttp@${XHTTP_VERSION}

          go mod download \
            github.com/justinwoo280/sing-xhttp@${XHTTP_VERSION}

          echo
          echo "sing-xhttp module:"
          go list -m github.com/justinwoo280/sing-xhttp

      - name: Add XHTTP constant
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path

          p = Path("constant/v2ray.go")
          s = p.read_text()

          if "V2RayTransportTypeXHTTP" in s:
              print("XHTTP constant already exists.")
              raise SystemExit(0)

          old = '\tV2RayTransportTypeHTTPUpgrade = "httpupgrade"\n'

          if old not in s:
              raise SystemExit(
                  "ERROR: unexpected constant/v2ray.go structure"
              )

          new = (
              old +
              '\tV2RayTransportTypeXHTTP       = "xhttp"\n'
          )

          p.write_text(s.replace(old, new, 1))

          print("XHTTP constant added.")
          PY

          cat constant/v2ray.go

      - name: Add XHTTP options
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path

          p = Path("option/v2ray_transport.go")
          s = p.read_text()

          if "github.com/justinwoo280/sing-xhttp/xhttp" not in s:
              marker = (
                  '\t"github.com/sagernet/sing-box/schema"\n'
              )

              if marker not in s:
                  raise SystemExit(
                      "ERROR: cannot find schema import"
                  )

              s = s.replace(
                  marker,
                  marker +
                  '\t"github.com/justinwoo280/sing-xhttp/xhttp"\n',
                  1
              )

          old = '''type _V2RayTransportOptions struct {
\tType               string                  `json:"type" enum:"http,ws,quic,grpc,httpupgrade"`
\tHTTPOptions        V2RayHTTPOptions        `json:"-"`
\tWebsocketOptions   V2RayWebsocketOptions   `json:"-"`
\tQUICOptions        V2RayQUICOptions        `json:"-"`
\tGRPCOptions        V2RayGRPCOptions        `json:"-"`
\tHTTPUpgradeOptions V2RayHTTPUpgradeOptions `json:"-"`
}'''

          new = '''type _V2RayTransportOptions struct {
\tType               string                  `json:"type" enum:"http,ws,quic,grpc,httpupgrade,xhttp"`
\tHTTPOptions        V2RayHTTPOptions        `json:"-"`
\tWebsocketOptions   V2RayWebsocketOptions   `json:"-"`
\tQUICOptions        V2RayQUICOptions        `json:"-"`
\tGRPCOptions        V2RayGRPCOptions        `json:"-"`
\tHTTPUpgradeOptions V2RayHTTPUpgradeOptions `json:"-"`
\tXHTTPOptions       xhttp.Options           `json:"-"`
}'''

          if old not in s:
              raise SystemExit(
                  "ERROR: unexpected _V2RayTransportOptions structure"
              )

          s = s.replace(old, new, 1)

          old = '''\tcase C.V2RayTransportTypeHTTPUpgrade:
\t\tv = o.HTTPUpgradeOptions
\tcase "":
'''

          new = '''\tcase C.V2RayTransportTypeHTTPUpgrade:
\t\tv = o.HTTPUpgradeOptions
\tcase C.V2RayTransportTypeXHTTP:
\t\tv = o.XHTTPOptions
\tcase "":
'''

          if old not in s:
              raise SystemExit(
                  "ERROR: cannot find MarshalJSON HTTPUpgrade case"
              )

          s = s.replace(old, new, 1)

          old = '''\tcase C.V2RayTransportTypeHTTPUpgrade:
\t\tv = &o.HTTPUpgradeOptions
\tdefault:
'''

          new = '''\tcase C.V2RayTransportTypeHTTPUpgrade:
\t\tv = &o.HTTPUpgradeOptions
\tcase C.V2RayTransportTypeXHTTP:
\t\tv = &o.XHTTPOptions
\tdefault:
'''

          if old not in s:
              raise SystemExit(
                  "ERROR: cannot find UnmarshalJSON HTTPUpgrade case"
              )

          s = s.replace(old, new, 1)

          old = '''\t\t\t{Value: C.V2RayTransportTypeHTTPUpgrade, StructType: reflect.TypeFor[V2RayHTTPUpgradeOptions]()},
\t\t}, nil)
'''

          new = '''\t\t\t{Value: C.V2RayTransportTypeHTTPUpgrade, StructType: reflect.TypeFor[V2RayHTTPUpgradeOptions]()},
\t\t\t{Value: C.V2RayTransportTypeXHTTP, StructType: reflect.TypeFor[xhttp.Options]()},
\t\t}, nil)
'''

          if old not in s:
              raise SystemExit(
                  "ERROR: cannot find DescribeSchema HTTPUpgrade variant"
              )

          s = s.replace(old, new, 1)

          p.write_text(s)

          print("XHTTP option integration completed.")
          PY

          echo
          grep -n \
            -E \
            'XHTTP|xhttp' \
            option/v2ray_transport.go

      - name: Add XHTTP server and client
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path

          p = Path("transport/v2ray/transport.go")
          s = p.read_text()

          if "github.com/justinwoo280/sing-xhttp/xhttp" not in s:
              marker = (
                  '\t"github.com/sagernet/sing-box/transport/v2rayhttpupgrade"\n'
              )

              if marker not in s:
                  raise SystemExit(
                      "ERROR: cannot find v2rayhttpupgrade import"
                  )

              s = s.replace(
                  marker,
                  marker +
                  '\t"github.com/justinwoo280/sing-xhttp/xhttp"\n',
                  1
              )

          old = '''\tcase C.V2RayTransportTypeHTTPUpgrade:
\t\treturn v2rayhttpupgrade.NewServer(ctx, logger, options.HTTPUpgradeOptions, tlsConfig, handler)
\tdefault:
'''

          new = '''\tcase C.V2RayTransportTypeHTTPUpgrade:
\t\treturn v2rayhttpupgrade.NewServer(ctx, logger, options.HTTPUpgradeOptions, tlsConfig, handler)
\tcase C.V2RayTransportTypeXHTTP:
\t\treturn xhttp.NewServer(ctx, logger, options.XHTTPOptions, tlsConfig, handler)
\tdefault:
'''

          if old not in s:
              raise SystemExit(
                  "ERROR: cannot find server HTTPUpgrade case"
              )

          s = s.replace(old, new, 1)

          old = '''\tcase C.V2RayTransportTypeHTTPUpgrade:
\t\treturn v2rayhttpupgrade.NewClient(ctx, dialer, serverAddr, options.HTTPUpgradeOptions, tlsConfig)
\tdefault:
'''

          new = '''\tcase C.V2RayTransportTypeHTTPUpgrade:
\t\treturn v2rayhttpupgrade.NewClient(ctx, dialer, serverAddr, options.HTTPUpgradeOptions, tlsConfig)
\tcase C.V2RayTransportTypeXHTTP:
\t\treturn xhttp.NewClient(ctx, dialer, serverAddr, options.XHTTPOptions, tlsConfig)
\tdefault:
'''

          if old not in s:
              raise SystemExit(
                  "ERROR: cannot find client HTTPUpgrade case"
              )

          s = s.replace(old, new, 1)

          p.write_text(s)

          print("XHTTP server/client integration completed.")
          PY

          echo
          grep -n \
            -E \
            'XHTTP|xhttp' \
            transport/v2ray/transport.go

      - name: Format Go source
        shell: bash
        run: |
          set -euo pipefail

          gofmt -w \
            constant/v2ray.go \
            option/v2ray_transport.go \
            transport/v2ray/transport.go

      - name: Verify XHTTP integration
        shell: bash
        run: |
          set -euo pipefail

          echo "========== constant =========="
          grep -n \
            "V2RayTransportTypeXHTTP" \
            constant/v2ray.go

          echo
          echo "========== option =========="
          grep -n \
            -E \
            'XHTTPOptions|V2RayTransportTypeXHTTP|sing-xhttp' \
            option/v2ray_transport.go

          echo
          echo "========== transport =========="
          grep -n \
            -E \
            'XHTTP|xhttp.NewServer|xhttp.NewClient|sing-xhttp' \
            transport/v2ray/transport.go

          echo
          echo "========== module =========="
          go list -m github.com/justinwoo280/sing-xhttp

      - name: Build sing-box
        shell: bash
        env:
          CGO_ENABLED: "0"
          GOOS: linux
        run: |
          set -euxo pipefail

          if [ "${{ matrix.arch }}" = "amd64" ]; then
            GOARCH=amd64
          else
            GOARCH=arm64
          fi

          OFFICIAL_VERSION="${{ needs.get-version.outputs.upstream_version }}"

          OFFICIAL_TAGS="$(
            tr '\n' ',' < release/DEFAULT_BUILD_TAGS |
            sed 's/,$//'
          )"

          TAGS="${OFFICIAL_TAGS},with_purego,with_v2ray_api"

          LDFLAGS_SHARED="$(cat release/LDFLAGS)"

          echo "Official version: v${OFFICIAL_VERSION}"
          echo "Architecture: ${GOARCH}"
          echo "Build tags: ${TAGS}"
          echo "LDFLAGS: ${LDFLAGS_SHARED}"

          go mod download

          GOARCH="${GOARCH}" \
          go build \
            -v \
            -trimpath \
            -o "sing-box-linux-${{ matrix.arch }}" \
            -tags "${TAGS}" \
            -ldflags "-X 'github.com/sagernet/sing-box/constant.Version=${OFFICIAL_VERSION}' ${LDFLAGS_SHARED} -s -w -buildid=" \
            ./cmd/sing-box

      - name: Check build
        shell: bash
        run: |
          set -euxo pipefail

          chmod +x \
            "sing-box-linux-${{ matrix.arch }}"

          "./sing-box-linux-${{ matrix.arch }}" version

          echo
          echo "========== Binary =========="

          ls -lh \
            "sing-box-linux-${{ matrix.arch }}"

          file \
            "sing-box-linux-${{ matrix.arch }}"

      - name: Test XHTTP inbound and outbound
        shell: bash
        run: |
          set -euo pipefail

          cat > xhttp-test.json <<'EOF'
          {
            "log": {
              "level": "error"
            },
            "inbounds": [
              {
                "type": "vless",
                "tag": "xhttp-in",
                "listen": "127.0.0.1",
                "listen_port": 18443,
                "users": [
                  {
                    "name": "xhttp-test",
                    "uuid": "8a21b0ab-c9a6-4763-bbc5-9a170a8a1869"
                  }
                ],
                "transport": {
                  "type": "xhttp",
                  "mode": "auto",
                  "path": "/xhttp"
                }
              }
            ],
            "outbounds": [
              {
                "type": "vless",
                "tag": "xhttp-out",
                "server": "127.0.0.1",
                "server_port": 18443,
                "uuid": "8a21b0ab-c9a6-4763-bbc5-9a170a8a1869",
                "transport": {
                  "type": "xhttp",
                  "mode": "auto",
                  "path": "/xhttp"
                }
              },
              {
                "type": "direct",
                "tag": "direct"
              }
            ]
          }
          EOF

          echo "========== XHTTP test config =========="
          cat xhttp-test.json

          echo
          echo "========== sing-box check =========="

          "./sing-box-linux-${{ matrix.arch }}" \
            check \
            -c xhttp-test.json

          echo
          echo "XHTTP inbound/outbound configuration check passed."

      - name: Upload Artifact
        uses: actions/upload-artifact@v5
        with:
          name: sing-box-${{ needs.get-version.outputs.upstream_version }}-xhttp-v2rayapi-linux-${{ matrix.arch }}
          path: sing-box-linux-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 90

  release:
    needs:
      - get-version
      - build

    runs-on: ubuntu-24.04

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v5
        with:
          path: release-files

      - name: Prepare release files
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p release

          find release-files \
            -type f \
            -name 'sing-box-linux-amd64' \
            -exec cp {} release/sing-box-linux-amd64 \;

          find release-files \
            -type f \
            -name 'sing-box-linux-arm64' \
            -exec cp {} release/sing-box-linux-arm64 \;

          test -f release/sing-box-linux-amd64
          test -f release/sing-box-linux-arm64

          chmod +x \
            release/sing-box-linux-amd64 \
            release/sing-box-linux-arm64

          tar -czf \
            release/sing-box-linux-amd64.tar.gz \
            -C release \
            sing-box-linux-amd64

          tar -czf \
            release/sing-box-linux-arm64.tar.gz \
            -C release \
            sing-box-linux-arm64

          rm -f \
            release/sing-box-linux-amd64 \
            release/sing-box-linux-arm64

          ls -lh release

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.get-version.outputs.upstream_version }}-xhttp-v2rayapi
          name: sing-box v${{ needs.get-version.outputs.upstream_version }} XHTTP + V2Ray API
          make_latest: false
          generate_release_notes: false

          body: |
            Based on official SagerNet/sing-box v${{ needs.get-version.outputs.upstream_version }}

            Added:
            - github.com/justinwoo280/sing-xhttp v0.1.6
            - XHTTP inbound/server
            - XHTTP outbound/client
            - with_v2ray_api

            Official sing-box DEFAULT_BUILD_TAGS are preserved.

            Additional build tag:
            - with_purego

            Architectures:
            - Linux amd64
            - Linux arm64

            No sing-box-lx features are included.

          files: |
            release/sing-box-linux-amd64.tar.gz
            release/sing-box-linux-arm64.tar.gz

          fail_on_unmatched_files: true
          
