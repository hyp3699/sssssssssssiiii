name: Build sing-box

on:
  workflow_dispatch:
  schedule:
    - cron: "30 2 * * *"

permissions:
  contents: write

jobs:
  get-version:
    runs-on: ubuntu-24.04
    outputs:
      upstream_version: ${{ steps.version.outputs.upstream_version }}
      lx_tag: ${{ steps.version.outputs.lx_tag }}
    steps:
      - name: Get latest stable versions
        id: version
        shell: bash
        run: |
          set -euo pipefail

          UPSTREAM_VERSION="$(
            curl -fsSL https://api.github.com/repos/SagerNet/sing-box/releases/latest |
            jq -r '.tag_name' |
            sed 's/^v//'
          )"

          [ -n "$UPSTREAM_VERSION" ] || {
            echo "Failed to detect latest official sing-box version"
            exit 1
          }

          LX_TAG="$(
            git ls-remote --tags --refs \
              https://github.com/Leadaxe/sing-box-lx.git \
              "refs/tags/v${UPSTREAM_VERSION}-lx.*" |
            awk -F/ '{print $3}' |
            sort -V |
            tail -n1
          )"

          [ -n "$LX_TAG" ] || {
            echo "No matching sing-box-lx tag found for v${UPSTREAM_VERSION}"
            exit 1
          }

          echo "upstream_version=${UPSTREAM_VERSION}" >> "$GITHUB_OUTPUT"
          echo "lx_tag=${LX_TAG}" >> "$GITHUB_OUTPUT"

          echo "Official: v${UPSTREAM_VERSION}"
          echo "LX: ${LX_TAG}"

  build:
    needs: get-version
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        arch:
          - amd64
          - arm64

    steps:
      - name: Checkout official sing-box
        uses: actions/checkout@v5
        with:
          repository: SagerNet/sing-box
          ref: v${{ needs.get-version.outputs.upstream_version }}
          fetch-depth: 1
          submodules: recursive

      - name: Setup Git
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch matching sing-box-lx
        shell: bash
        run: |
          set -euxo pipefail

          git remote add lx https://github.com/Leadaxe/sing-box-lx.git

          git fetch \
            --filter=blob:none \
            --no-tags \
            lx \
            "refs/tags/${{ needs.get-version.outputs.lx_tag }}:refs/remotes/lx/${{ needs.get-version.outputs.lx_tag }}"

          git fetch \
            --filter=blob:none \
            --no-tags \
            lx \
            "refs/heads/lx:refs/remotes/lx/lx"

      - name: Import only XHTTP commits
        shell: bash
        run: |
          set -euo pipefail

          OFFICIAL_COMMIT="$(git rev-parse HEAD)"
          LX_REF="refs/remotes/lx/${{ needs.get-version.outputs.lx_tag }}"
          LX_COMMIT="$(git rev-parse "$LX_REF")"

          echo "Official commit: ${OFFICIAL_COMMIT}"
          echo "LX commit: ${LX_COMMIT}"

          if ! git merge-base --is-ancestor "$OFFICIAL_COMMIT" "$LX_COMMIT"; then
            echo "ERROR: LX tag is not based on the checked-out official commit."
            echo "Official: ${OFFICIAL_COMMIT}"
            echo "LX: ${LX_COMMIT}"
            exit 1
          fi

          XHTTP_ROOT="$(
            git log \
              --reverse \
              --format='%H' \
              --diff-filter=A \
              "$LX_COMMIT" \
              -- \
              option/v2ray_xhttp.go |
            head -n1
          )"

          [ -n "$XHTTP_ROOT" ] || {
            echo "ERROR: Unable to find the original XHTTP implementation commit."
            exit 1
          }

          echo "XHTTP root commit: ${XHTTP_ROOT}"

          mapfile -t XHTTP_COMMITS < <(
            git log \
              --reverse \
              --format='%H' \
              "${XHTTP_ROOT}^..${LX_COMMIT}" \
              -- \
              option/v2ray_xhttp.go \
              option/v2ray_xhttp_xmux_range.go \
              include/v2rayxhttp.go \
              transport/v2rayxhttp \
              common/badh2
          )

          [ "${#XHTTP_COMMITS[@]}" -gt 0 ] || {
            echo "ERROR: No XHTTP commits found."
            exit 1
          }

          echo "XHTTP commits:"
          printf '  %s\n' "${XHTTP_COMMITS[@]}"

          ALLOWED_REGEX='^(common/badh2/|include/v2rayxhttp\.go$|option/v2ray_xhttp(_xmux_range)?(_test)?\.go$|transport/v2rayxhttp/|constant/v2ray\.go$|option/v2ray_transport\.go$|transport/v2ray/(registry|transport)\.go$)'

          for COMMIT in "${XHTTP_COMMITS[@]}"; do
            SUBJECT="$(git show -s --format='%s' "$COMMIT")"

            echo
            echo "=================================================="
            echo "Applying XHTTP commit: ${COMMIT}"
            echo "Subject: ${SUBJECT}"
            echo "=================================================="

            BEFORE="$(git rev-parse HEAD)"

            if ! git cherry-pick --no-commit --3way "$COMMIT"; then
              echo
              echo "ERROR: XHTTP commit could not be cleanly applied."
              echo "Commit: ${COMMIT}"
              git status --short || true
              git cherry-pick --abort || true
              exit 1
            fi

            mapfile -t CHANGED_FILES < <(
              git diff --name-only "$BEFORE"
            )

            if [ "${#CHANGED_FILES[@]}" -eq 0 ]; then
              echo "No file changes from commit ${COMMIT}"
              git reset --hard "$BEFORE"
              continue
            fi

            echo "Changed files:"
            printf '  %s\n' "${CHANGED_FILES[@]}"

            BAD_FILES=()

            for FILE in "${CHANGED_FILES[@]}"; do
              if [[ ! "$FILE" =~ $ALLOWED_REGEX ]]; then
                BAD_FILES+=("$FILE")
              fi
            done

            if [ "${#BAD_FILES[@]}" -gt 0 ]; then
              echo
              echo "ERROR: XHTTP commit contains non-XHTTP files."
              echo "The build is stopped to prevent LX features from leaking in."
              echo
              echo "Commit:"
              echo "  ${COMMIT}"
              echo
              echo "Subject:"
              echo "  ${SUBJECT}"
              echo
              echo "Forbidden files:"
              printf '  %s\n' "${BAD_FILES[@]}"

              git reset --hard "$BEFORE"
              exit 1
            fi

            git add -A
            git commit -m "Import LX XHTTP: ${COMMIT:0:12}" \
              -m "${SUBJECT}"
          done

          echo
          echo "=================================================="
          echo "XHTTP import completed"
          echo "=================================================="

          echo
          echo "Official baseline:"
          echo "  ${OFFICIAL_COMMIT}"

          echo
          echo "Final changed files:"
          git diff --name-only "${OFFICIAL_COMMIT}" HEAD

          echo
          echo "Verifying only XHTTP-related files changed..."

          mapfile -t FINAL_FILES < <(
            git diff --name-only "${OFFICIAL_COMMIT}" HEAD
          )

          for FILE in "${FINAL_FILES[@]}"; do
            if [[ ! "$FILE" =~ $ALLOWED_REGEX ]]; then
              echo "ERROR: unexpected file in final tree: ${FILE}"
              exit 1
            fi
          done

          test -f option/v2ray_xhttp.go
          test -f option/v2ray_xhttp_xmux_range.go
          test -f include/v2rayxhttp.go
          test -d transport/v2rayxhttp
          test -d common/badh2

          echo
          echo "XHTTP verification passed."

      - name: Show imported XHTTP changes
        shell: bash
        run: |
          set -euo pipefail

          echo "========== Imported XHTTP files =========="
          git status --short

          echo
          echo "========== Diffstat =========="
          git diff HEAD~"${#XHTTP_COMMITS[@]}" HEAD --stat 2>/dev/null || true

          echo
          echo "========== XHTTP files =========="
          find \
            common/badh2 \
            transport/v2rayxhttp \
            option \
            include \
            constant \
            transport/v2ray \
            -maxdepth 3 \
            -type f \
            \( \
              -path '*/badh2/*' -o \
              -path '*/v2rayxhttp/*' -o \
              -name 'v2ray_xhttp.go' -o \
              -name 'v2ray_xhttp_xmux_range.go' -o \
              -name 'v2ray_xhttp_xmux_range_test.go' -o \
              -name 'v2rayxhttp.go' \
            \) \
            2>/dev/null |
            sort || true

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.8"
          cache: true

      - name: Build sing-box
        shell: bash
        env:
          CGO_ENABLED: "0"
          GOOS: linux
        run: |
          set -euxo pipefail

          if [ "${{ matrix.arch }}" = "amd64" ]; then
            GOARCH=amd64
          else
            GOARCH=arm64
          fi

          OFFICIAL_VERSION="${{ needs.get-version.outputs.upstream_version }}"
          LX_TAG="${{ needs.get-version.outputs.lx_tag }}"

          OFFICIAL_TAGS="$(tr '\n' ',' < release/DEFAULT_BUILD_TAGS | sed 's/,$//')"

          TAGS="${OFFICIAL_TAGS},with_purego,with_xhttp,with_v2ray_api"

          LDFLAGS_SHARED="$(cat release/LDFLAGS)"

          echo "Official version: v${OFFICIAL_VERSION}"
          echo "LX version: ${LX_TAG}"
          echo "Architecture: ${GOARCH}"
          echo "Build tags: ${TAGS}"
          echo "LDFLAGS: ${LDFLAGS_SHARED}"

          go mod download

          go build -v -trimpath \
            -o "sing-box-linux-${{ matrix.arch }}" \
            -tags "${TAGS}" \
            -ldflags "-X 'github.com/sagernet/sing-box/constant.Version=${OFFICIAL_VERSION}' ${LDFLAGS_SHARED} -s -w -buildid=" \
            ./cmd/sing-box

      - name: Check build
        shell: bash
        run: |
          set -euxo pipefail

          chmod +x "sing-box-linux-${{ matrix.arch }}"

          "./sing-box-linux-${{ matrix.arch }}" version

          echo
          echo "Binary information:"
          ls -lh "sing-box-linux-${{ matrix.arch }}"
          file "sing-box-linux-${{ matrix.arch }}"

      - name: Upload Artifact
        uses: actions/upload-artifact@v5
        with:
          name: sing-box-${{ needs.get-version.outputs.upstream_version }}-xhttp-v2rayapi-linux-${{ matrix.arch }}
          path: sing-box-linux-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 90

  release:
    needs:
      - get-version
      - build
    runs-on: ubuntu-24.04

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v5
        with:
          path: release-files

      - name: Prepare release files
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p release

          find release-files \
            -type f \
            -name 'sing-box-linux-amd64' \
            -exec cp {} release/sing-box-linux-amd64 \;

          find release-files \
            -type f \
            -name 'sing-box-linux-arm64' \
            -exec cp {} release/sing-box-linux-arm64 \;

          test -f release/sing-box-linux-amd64
          test -f release/sing-box-linux-arm64

          chmod +x \
            release/sing-box-linux-amd64 \
            release/sing-box-linux-arm64

          ls -lh release

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.get-version.outputs.upstream_version }}-xhttp-v2rayapi
          name: sing-box v${{ needs.get-version.outputs.upstream_version }} XHTTP + V2Ray API
          make_latest: false
          generate_release_notes: false
          body: |
            Based on official SagerNet/sing-box v${{ needs.get-version.outputs.upstream_version }}

            XHTTP source:
            Leadaxe/sing-box-lx ${{ needs.get-version.outputs.lx_tag }}

            This build:
            - Preserves official sing-box build features
            - Adds XHTTP from sing-box-lx
            - Adds with_v2ray_api
            - Adds with_purego for CGO-disabled builds

            Architectures:
            - Linux amd64
            - Linux arm64

            LX-only features such as AWG, lx_command, lxd, lx_chain and MASQUE are not intentionally included.

            XHTTP changes are imported commit-by-commit and the workflow aborts if an imported XHTTP commit modifies files outside the approved XHTTP file set.
          files: |
            release/sing-box-linux-amd64
            release/sing-box-linux-arm64
          fail_on_unmatched_files: true
