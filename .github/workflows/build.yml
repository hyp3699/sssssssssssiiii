name: Build sing-box

on:
  workflow_dispatch:
  schedule:
    - cron: "30 2 * * *"

permissions:
  contents: write

jobs:
  get-version:
    runs-on: ubuntu-24.04

    outputs:
      upstream_version: ${{ steps.version.outputs.upstream_version }}

    steps:
      - name: Get official sing-box version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          UPSTREAM_VERSION="$(
            curl -fsSL \
              https://api.github.com/repos/SagerNet/sing-box/releases/latest |
            jq -r '.tag_name' |
            sed 's/^v//'
          )"

          if [ -z "$UPSTREAM_VERSION" ] || [ "$UPSTREAM_VERSION" = "null" ]; then
            echo "ERROR: Failed to detect official sing-box version"
            exit 1
          fi

          echo "upstream_version=${UPSTREAM_VERSION}" >> "$GITHUB_OUTPUT"

          echo "Official sing-box version: v${UPSTREAM_VERSION}"

  build:
    needs: get-version

    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false

      matrix:
        arch:
          - amd64
          - arm64

    steps:
      - name: Checkout official sing-box
        uses: actions/checkout@v5
        with:
          repository: SagerNet/sing-box
          ref: v${{ needs.get-version.outputs.upstream_version }}
          fetch-depth: 1
          submodules: recursive

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.8"
          cache: true

      - name: Verify sing-box source
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${{ needs.get-version.outputs.upstream_version }}"

          if [ "$VERSION" != "1.14.1" ]; then
            echo "ERROR: This workflow is prepared for sing-box v1.14.1."
            echo "Detected official version: v${VERSION}"
            echo
            echo "Please update the XHTTP integration before using another version."
            exit 1
          fi

          test -f constant/v2ray.go
          test -f option/v2ray_transport.go
          test -f transport/v2ray/transport.go

          echo "Verified official sing-box v${VERSION}"

      - name: Add sing-xhttp
        shell: bash
        run: |
          set -euo pipefail

          XHTTP_VERSION="v0.1.6"

          echo "Adding sing-xhttp ${XHTTP_VERSION}"

          go mod edit \
            -require=github.com/justinwoo280/sing-xhttp@${XHTTP_VERSION}

          go mod download \
            github.com/justinwoo280/sing-xhttp@${XHTTP_VERSION}

          echo
          echo "========== sing-xhttp =========="

          go list -m github.com/justinwoo280/sing-xhttp

      - name: Add XHTTP constant
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path

          path = Path("constant/v2ray.go")
          source = path.read_text()

          if "V2RayTransportTypeXHTTP" in source:
              print("XHTTP constant already exists.")
              raise SystemExit(0)

          marker = '\tV2RayTransportTypeHTTPUpgrade = "httpupgrade"\n'

          if marker not in source:
              raise SystemExit(
                  "ERROR: Unexpected constant/v2ray.go structure."
              )

          replacement = (
              marker +
              '\tV2RayTransportTypeXHTTP = "xhttp"\n'
          )

          source = source.replace(marker, replacement, 1)

          path.write_text(source)

          print("XHTTP constant added successfully.")
          PY

          echo
          cat constant/v2ray.go

      - name: Add XHTTP options
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path

          path = Path("option/v2ray_transport.go")
          source = path.read_text()

          # ---------------------------------------------------------
          # Import sing-xhttp
          # ---------------------------------------------------------

          import_marker = (
              '\t"github.com/sagernet/sing-box/schema"\n'
          )

          xhttp_import = (
              '\t"github.com/justinwoo280/sing-xhttp/xhttp"\n'
          )

          if "github.com/justinwoo280/sing-xhttp/xhttp" not in source:
              if import_marker not in source:
                  raise SystemExit(
                      "ERROR: Cannot find sing-box schema import."
                  )

              source = source.replace(
                  import_marker,
                  import_marker + xhttp_import,
                  1
              )

          # ---------------------------------------------------------
          # Add XHTTPOptions to _V2RayTransportOptions
          # ---------------------------------------------------------

          old = '''type _V2RayTransportOptions struct {
          Type               string                  `json:"type" enum:"http,ws,quic,grpc,httpupgrade"`
          HTTPOptions        V2RayHTTPOptions        `json:"-"`
          WebsocketOptions   V2RayWebsocketOptions   `json:"-"`
          QUICOptions        V2RayQUICOptions        `json:"-"`
          GRPCOptions        V2RayGRPCOptions        `json:"-"`
          HTTPUpgradeOptions V2RayHTTPUpgradeOptions `json:"-"`
          }'''

          new = '''type _V2RayTransportOptions struct {
          Type               string                  `json:"type" enum:"http,ws,quic,grpc,httpupgrade,xhttp"`
          HTTPOptions        V2RayHTTPOptions        `json:"-"`
          WebsocketOptions   V2RayWebsocketOptions   `json:"-"`
          QUICOptions        V2RayQUICOptions        `json:"-"`
          GRPCOptions        V2RayGRPCOptions        `json:"-"`
          HTTPUpgradeOptions V2RayHTTPUpgradeOptions `json:"-"`
          XHTTPOptions       xhttp.Options           `json:"-"`
          }'''

          if "XHTTPOptions" not in source:
              if old not in source:
                  raise SystemExit(
                      "ERROR: Unexpected _V2RayTransportOptions structure."
                  )

              source = source.replace(old, new, 1)

          # ---------------------------------------------------------
          # MarshalJSON
          # ---------------------------------------------------------

          marshal_old = '''\tcase C.V2RayTransportTypeHTTPUpgrade:
          \t\tv = o.HTTPUpgradeOptions
          \tcase "":
          '''

          marshal_new = '''\tcase C.V2RayTransportTypeHTTPUpgrade:
          \t\tv = o.HTTPUpgradeOptions
          \tcase C.V2RayTransportTypeXHTTP:
          \t\tv = o.XHTTPOptions
          \tcase "":
          '''

          if "case C.V2RayTransportTypeXHTTP:" not in source:
              if marshal_old not in source:
                  raise SystemExit(
                      "ERROR: Cannot find MarshalJSON HTTPUpgrade case."
                  )

              source = source.replace(
                  marshal_old,
                  marshal_new,
                  1
              )

          # ---------------------------------------------------------
          # UnmarshalJSON
          # ---------------------------------------------------------

          unmarshal_old = '''\tcase C.V2RayTransportTypeHTTPUpgrade:
          \t\tv = &o.HTTPUpgradeOptions
          \tdefault:
          '''

          unmarshal_new = '''\tcase C.V2RayTransportTypeHTTPUpgrade:
          \t\tv = &o.HTTPUpgradeOptions
          \tcase C.V2RayTransportTypeXHTTP:
          \t\tv = &o.XHTTPOptions
          \tdefault:
          '''

          if "v = &o.XHTTPOptions" not in source:
              if unmarshal_old not in source:
                  raise SystemExit(
                      "ERROR: Cannot find UnmarshalJSON HTTPUpgrade case."
                  )

              source = source.replace(
                  unmarshal_old,
                  unmarshal_new,
                  1
              )

          # ---------------------------------------------------------
          # DescribeSchema
          # ---------------------------------------------------------

          schema_old = '''\t\t\t{Value: C.V2RayTransportTypeHTTPUpgrade, StructType: reflect.TypeFor[V2RayHTTPUpgradeOptions]()},
          \t\t}, nil)
          '''

          schema_new = '''\t\t\t{Value: C.V2RayTransportTypeHTTPUpgrade, StructType: reflect.TypeFor[V2RayHTTPUpgradeOptions]()},
          \t\t\t{Value: C.V2RayTransportTypeXHTTP, StructType: reflect.TypeFor[xhttp.Options]()},
          \t\t}, nil)
          '''

          if "reflect.TypeFor[xhttp.Options]()" not in source:
              if schema_old not in source:
                  raise SystemExit(
                      "ERROR: Cannot find DescribeSchema HTTPUpgrade variant."
                  )

              source = source.replace(
                  schema_old,
                  schema_new,
                  1
              )

          path.write_text(source)

          print("XHTTP option integration completed successfully.")
          PY

          echo
          echo "========== XHTTP option references =========="

          grep -n \
            -E \
            'XHTTP|xhttp' \
            option/v2ray_transport.go

      - name: Add XHTTP server and client
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path

          path = Path("transport/v2ray/transport.go")
          source = path.read_text()

          # ---------------------------------------------------------
          # Import sing-xhttp
          # ---------------------------------------------------------

          import_marker = (
              '\t"github.com/sagernet/sing-box/transport/v2rayhttpupgrade"\n'
          )

          xhttp_import = (
              '\t"github.com/justinwoo280/sing-xhttp/xhttp"\n'
          )

          if "github.com/justinwoo280/sing-xhttp/xhttp" not in source:
              if import_marker not in source:
                  raise SystemExit(
                      "ERROR: Cannot find v2rayhttpupgrade import."
                  )

              source = source.replace(
                  import_marker,
                  import_marker + xhttp_import,
                  1
              )

          # ---------------------------------------------------------
          # XHTTP server
          # ---------------------------------------------------------

          server_old = '''\tcase C.V2RayTransportTypeHTTPUpgrade:
          \t\treturn v2rayhttpupgrade.NewServer(ctx, logger, options.HTTPUpgradeOptions, tlsConfig, handler)
          \tdefault:
          '''

          server_new = '''\tcase C.V2RayTransportTypeHTTPUpgrade:
          \t\treturn v2rayhttpupgrade.NewServer(ctx, logger, options.HTTPUpgradeOptions, tlsConfig, handler)
          \tcase C.V2RayTransportTypeXHTTP:
          \t\treturn xhttp.NewServer(ctx, logger, options.XHTTPOptions, tlsConfig, handler)
          \tdefault:
          '''

          if "xhttp.NewServer" not in source:
              if server_old not in source:
                  raise SystemExit(
                      "ERROR: Cannot find V2Ray server HTTPUpgrade case."
                  )

              source = source.replace(
                  server_old,
                  server_new,
                  1
              )

          # ---------------------------------------------------------
          # XHTTP client
          # ---------------------------------------------------------

          client_old = '''\tcase C.V2RayTransportTypeHTTPUpgrade:
          \t\treturn v2rayhttpupgrade.NewClient(ctx, dialer, serverAddr, options.HTTPUpgradeOptions, tlsConfig)
          \tdefault:
          '''

          client_new = '''\tcase C.V2RayTransportTypeHTTPUpgrade:
          \t\treturn v2rayhttpupgrade.NewClient(ctx, dialer, serverAddr, options.HTTPUpgradeOptions, tlsConfig)
          \tcase C.V2RayTransportTypeXHTTP:
          \t\treturn xhttp.NewClient(ctx, dialer, serverAddr, options.XHTTPOptions, tlsConfig)
          \tdefault:
          '''

          if "xhttp.NewClient" not in source:
              if client_old not in source:
                  raise SystemExit(
                      "ERROR: Cannot find V2Ray client HTTPUpgrade case."
                  )

              source = source.replace(
                  client_old,
                  client_new,
                  1
              )

          path.write_text(source)

          print("XHTTP server/client integration completed successfully.")
          PY

          echo
          echo "========== XHTTP transport references =========="

          grep -n \
            -E \
            'XHTTP|xhttp.NewServer|xhttp.NewClient|sing-xhttp' \
            transport/v2ray/transport.go

      - name: Format Go source
        shell: bash
        run: |
          set -euo pipefail

          gofmt -w \
            constant/v2ray.go \
            option/v2ray_transport.go \
            transport/v2ray/transport.go

      - name: Verify XHTTP integration
        shell: bash
        run: |
          set -euo pipefail

          echo "========== constant =========="

          grep -n \
            "V2RayTransportTypeXHTTP" \
            constant/v2ray.go

          echo
          echo "========== option =========="

          grep -n \
            -E \
            'XHTTPOptions|V2RayTransportTypeXHTTP|sing-xhttp' \
            option/v2ray_transport.go

          echo
          echo "========== transport =========="

          grep -n \
            -E \
            'XHTTP|xhttp.NewServer|xhttp.NewClient|sing-xhttp' \
            transport/v2ray/transport.go

          echo
          echo "========== module =========="

          go list -m github.com/justinwoo280/sing-xhttp

      - name: Build sing-box
        shell: bash
        env:
          CGO_ENABLED: "0"
          GOOS: linux

        run: |
          set -euxo pipefail

          case "${{ matrix.arch }}" in
            amd64)
              GOARCH=amd64
              ;;
            arm64)
              GOARCH=arm64
              ;;
            *)
              echo "Unsupported architecture"
              exit 1
              ;;
          esac

          OFFICIAL_VERSION="${{ needs.get-version.outputs.upstream_version }}"

          OFFICIAL_TAGS="$(
            tr '\n' ',' < release/DEFAULT_BUILD_TAGS |
            sed 's/,$//'
          )"

          TAGS="${OFFICIAL_TAGS},with_purego,with_v2ray_api"

          LDFLAGS_SHARED="$(cat release/LDFLAGS)"

          echo "========================================"
          echo "Official version : v${OFFICIAL_VERSION}"
          echo "Architecture     : ${GOARCH}"
          echo "Official tags    : ${OFFICIAL_TAGS}"
          echo "Final tags       : ${TAGS}"
          echo "LDFLAGS          : ${LDFLAGS_SHARED}"
          echo "========================================"

          go mod download

          GOARCH="${GOARCH}" \
          go build \
            -v \
            -trimpath \
            -o "sing-box-linux-${{ matrix.arch }}" \
            -tags "${TAGS}" \
            -ldflags "-X 'github.com/sagernet/sing-box/constant.Version=${OFFICIAL_VERSION}' ${LDFLAGS_SHARED} -s -w -buildid=" \
            ./cmd/sing-box

      - name: Verify binary
        shell: bash
        run: |
          set -euo pipefail

          BINARY="sing-box-linux-${{ matrix.arch }}"

          test -f "$BINARY"

          chmod +x "$BINARY"

          echo "========== sing-box version =========="

          "./${BINARY}" version

          echo
          echo "========== binary =========="

          ls -lh "$BINARY"

          file "$BINARY"

      - name: Test XHTTP configuration
        shell: bash
        run: |
          set -euo pipefail

          cat > xhttp-test.json <<'EOF'
          {
            "log": {
              "level": "error"
            },
            "inbounds": [
              {
                "type": "vless",
                "tag": "xhttp-in",
                "listen": "127.0.0.1",
                "listen_port": 18443,
                "users": [
                  {
                    "name": "xhttp-test",
                    "uuid": "8a21b0ab-c9a6-4763-bbc5-9a170a8a1869"
                  }
                ],
                "transport": {
                  "type": "xhttp",
                  "mode": "auto",
                  "path": "/xhttp"
                }
              }
            ],
            "outbounds": [
              {
                "type": "vless",
                "tag": "xhttp-out",
                "server": "127.0.0.1",
                "server_port": 18443,
                "uuid": "8a21b0ab-c9a6-4763-bbc5-9a170a8a1869",
                "transport": {
                  "type": "xhttp",
                  "mode": "auto",
                  "path": "/xhttp"
                }
              },
              {
                "type": "direct",
                "tag": "direct"
              }
            ]
          }
          EOF

          echo "========== XHTTP test configuration =========="

          cat xhttp-test.json

          echo
          echo "========== sing-box check =========="

          "./sing-box-linux-${{ matrix.arch }}" \
            check \
            -c xhttp-test.json

          echo
          echo "XHTTP configuration check PASSED."

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: sing-box-${{ needs.get-version.outputs.upstream_version }}-xhttp-v2rayapi-linux-${{ matrix.arch }}
          path: sing-box-linux-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 90

  release:
    needs:
      - get-version
      - build

    runs-on: ubuntu-24.04

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v5
        with:
          path: release-files

      - name: Prepare release files
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p release

          find release-files \
            -type f \
            -name 'sing-box-linux-amd64' \
            -exec cp {} release/sing-box-linux-amd64 \;

          find release-files \
            -type f \
            -name 'sing-box-linux-arm64' \
            -exec cp {} release/sing-box-linux-arm64 \;

          test -f release/sing-box-linux-amd64
          test -f release/sing-box-linux-arm64

          chmod +x \
            release/sing-box-linux-amd64 \
            release/sing-box-linux-arm64

          tar -czf \
            release/sing-box-linux-amd64.tar.gz \
            -C release \
            sing-box-linux-amd64

          tar -czf \
            release/sing-box-linux-arm64.tar.gz \
            -C release \
            sing-box-linux-arm64

          rm -f \
            release/sing-box-linux-amd64 \
            release/sing-box-linux-arm64

          echo "========== Release files =========="

          ls -lh release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.get-version.outputs.upstream_version }}-xhttp-v2rayapi

          name: sing-box v${{ needs.get-version.outputs.upstream_version }} XHTTP + V2Ray API

          make_latest: false

          generate_release_notes: false

          body: |
            Based on official SagerNet/sing-box v${{ needs.get-version.outputs.upstream_version }}.

            Added:
            - github.com/justinwoo280/sing-xhttp v0.1.6
            - XHTTP inbound/server
            - XHTTP outbound/client
            - with_v2ray_api

            Official sing-box DEFAULT_BUILD_TAGS are preserved.

            Additional build tag:
            - with_purego

            Architectures:
            - Linux amd64
            - Linux arm64

            This build does not use sing-box-lx.

          files: |
            release/sing-box-linux-amd64.tar.gz
            release/sing-box-linux-arm64.tar.gz

          fail_on_unmatched_files: true
