name: Build sing-box

on:
  workflow_dispatch:
  schedule:
    - cron: "30 2 * * *"

permissions:
  contents: write

jobs:
  get-version:
    runs-on: ubuntu-24.04

    outputs:
      upstream_version: ${{ steps.version.outputs.upstream_version }}
      xhttp_version: ${{ steps.version.outputs.xhttp_version }}

    steps:
      - name: Get latest stable versions
        id: version
        shell: bash
        run: |
          set -euo pipefail

          echo "==> Getting latest official sing-box release..."

          UPSTREAM_VERSION="$(
            curl -fsSL \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              https://api.github.com/repos/SagerNet/sing-box/releases/latest |
            jq -r '.tag_name'
          )"

          if [ -z "$UPSTREAM_VERSION" ] || [ "$UPSTREAM_VERSION" = "null" ]; then
            echo "ERROR: Failed to detect latest sing-box release."
            exit 1
          fi

          case "$UPSTREAM_VERSION" in
            v*) ;;
            *)
              echo "ERROR: Unexpected sing-box release tag: $UPSTREAM_VERSION"
              exit 1
              ;;
          esac

          echo "Official sing-box: $UPSTREAM_VERSION"


          echo "==> Getting latest sing-xhttp release..."

          XHTTP_VERSION="$(
            curl -fsSL \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              https://api.github.com/repos/justinwoo280/sing-xhttp/releases/latest |
            jq -r '.tag_name'
          )"

          if [ -z "$XHTTP_VERSION" ] || [ "$XHTTP_VERSION" = "null" ]; then
            echo "ERROR: Failed to detect latest sing-xhttp release."
            exit 1
          fi

          case "$XHTTP_VERSION" in
            v*) ;;
            *)
              echo "ERROR: Unexpected sing-xhttp release tag: $XHTTP_VERSION"
              exit 1
              ;;
          esac

          echo "sing-xhttp: $XHTTP_VERSION"


          echo "upstream_version=${UPSTREAM_VERSION#v}" >> "$GITHUB_OUTPUT"
          echo "xhttp_version=${XHTTP_VERSION}" >> "$GITHUB_OUTPUT"

  build:
    needs: get-version

    runs-on: ubuntu-24.04

    strategy:
      fail-fast: true
      matrix:
        arch:
          - amd64
          - arm64

    steps:
      - name: Checkout official sing-box
        uses: actions/checkout@v4
        with:
          repository: SagerNet/sing-box
          ref: v${{ needs.get-version.outputs.upstream_version }}
          submodules: recursive
          fetch-depth: 1

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify required files
        shell: bash
        run: |
          set -euo pipefail

          for file in \
            constant/v2ray.go \
            option/v2ray_transport.go \
            transport/v2ray/transport.go \
            release/DEFAULT_BUILD_TAGS \
            release/LDFLAGS
          do
            if [ ! -f "$file" ]; then
              echo "ERROR: Required file does not exist: $file"
              exit 1
            fi
          done

          echo "All required official sing-box files exist."


      - name: Add latest sing-xhttp dependency
        shell: bash
        env:
          XHTTP_VERSION: ${{ needs.get-version.outputs.xhttp_version }}
        run: |
          set -euo pipefail

          echo "Using sing-xhttp ${XHTTP_VERSION}"

          go mod edit \
            -require="github.com/justinwoo280/sing-xhttp@${XHTTP_VERSION}"

          go mod download \
            "github.com/justinwoo280/sing-xhttp@${XHTTP_VERSION}"


      - name: Patch official sing-box source
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path


          def replace_exact(path, old, new, description):
              path = Path(path)
              source = path.read_text()

              count = source.count(old)

              if count != 1:
                  raise SystemExit(
                      f"ERROR: {description}: expected exactly 1 match, found {count}"
                  )

              path.write_text(source.replace(old, new, 1))

              print(f"OK: {description}")


          # ============================================================
          # 1. constant/v2ray.go
          # ============================================================

          replace_exact(
              "constant/v2ray.go",

              '''\tV2RayTransportTypeHTTPUpgrade = "httpupgrade"\n''',

              '''\tV2RayTransportTypeHTTPUpgrade = "httpupgrade"
          \tV2RayTransportTypeXHTTP = "xhttp"
          \n''',

              "Add V2RayTransportTypeXHTTP"
          )


          # ============================================================
          # 2. option/v2ray_transport.go
          # ============================================================

          replace_exact(
              "option/v2ray_transport.go",

              '''\tC "github.com/sagernet/sing-box/constant"
          \t"github.com/sagernet/sing-box/schema"
          ''',

              '''\tC "github.com/sagernet/sing-box/constant"
          \t"github.com/justinwoo280/sing-xhttp/xhttp"
          \t"github.com/sagernet/sing-box/schema"
          ''',

              "Add sing-xhttp import"
          )


          replace_exact(
              "option/v2ray_transport.go",

              '''type _V2RayTransportOptions struct {
          \tType               string                  `json:"type" enum:"http,ws,quic,grpc,httpupgrade"`
          \tHTTPOptions        V2RayHTTPOptions        `json:"-"`
          \tWebsocketOptions   V2RayWebsocketOptions   `json:"-"`
          \tQUICOptions        V2RayQUICOptions        `json:"-"`
          \tGRPCOptions        V2RayGRPCOptions        `json:"-"`
          \tHTTPUpgradeOptions V2RayHTTPUpgradeOptions `json:"-"`
          }''',

              '''type _V2RayTransportOptions struct {
          \tType               string                  `json:"type" enum:"http,ws,quic,grpc,httpupgrade,xhttp"`
          \tHTTPOptions        V2RayHTTPOptions        `json:"-"`
          \tWebsocketOptions   V2RayWebsocketOptions   `json:"-"`
          \tQUICOptions        V2RayQUICOptions        `json:"-"`
          \tGRPCOptions        V2RayGRPCOptions        `json:"-"`
          \tHTTPUpgradeOptions V2RayHTTPUpgradeOptions `json:"-"`
          \tXHTTPOptions       xhttp.Options           `json:"-"`
          }''',

              "Add XHTTPOptions"
          )


          replace_exact(
              "option/v2ray_transport.go",

              '''\tcase C.V2RayTransportTypeHTTPUpgrade:
          \t\tv = o.HTTPUpgradeOptions
          \tcase "":
          ''',

              '''\tcase C.V2RayTransportTypeHTTPUpgrade:
          \t\tv = o.HTTPUpgradeOptions
          \tcase C.V2RayTransportTypeXHTTP:
          \t\tv = o.XHTTPOptions
          \tcase "":
          ''',

              "Add XHTTP MarshalJSON case"
          )


          replace_exact(
              "option/v2ray_transport.go",

              '''\tcase C.V2RayTransportTypeHTTPUpgrade:
          \t\tv = &o.HTTPUpgradeOptions
          \tdefault:
          ''',

              '''\tcase C.V2RayTransportTypeHTTPUpgrade:
          \t\tv = &o.HTTPUpgradeOptions
          \tcase C.V2RayTransportTypeXHTTP:
          \t\tv = &o.XHTTPOptions
          \tdefault:
          ''',

              "Add XHTTP UnmarshalJSON case"
          )


          replace_exact(
              "option/v2ray_transport.go",

              '''\t\t\t{Value: C.V2RayTransportTypeHTTPUpgrade, StructType: reflect.TypeFor[V2RayHTTPUpgradeOptions]()},
          \t\t}, nil)
          ''',

              '''\t\t\t{Value: C.V2RayTransportTypeHTTPUpgrade, StructType: reflect.TypeFor[V2RayHTTPUpgradeOptions]()},
          \t\t\t{Value: C.V2RayTransportTypeXHTTP, StructType: reflect.TypeFor[xhttp.Options]()},
          \t\t}, nil)
          ''',

              "Add XHTTP schema"
          )


          # ============================================================
          # 3. transport/v2ray/transport.go
          # ============================================================

          replace_exact(
              "transport/v2ray/transport.go",

              '''\t"github.com/sagernet/sing-box/transport/v2rayhttpupgrade"
          \t"github.com/sagernet/sing-box/transport/v2raywebsocket"
          ''',

              '''\t"github.com/sagernet/sing-box/transport/v2rayhttpupgrade"
          \t"github.com/justinwoo280/sing-xhttp/xhttp"
          \t"github.com/sagernet/sing-box/transport/v2raywebsocket"
          ''',

              "Add sing-xhttp transport import"
          )


          replace_exact(
              "transport/v2ray/transport.go",

              '''\tcase C.V2RayTransportTypeHTTPUpgrade:
          \t\treturn v2rayhttpupgrade.NewServer(ctx, logger, options.HTTPUpgradeOptions, tlsConfig, handler)
          \tdefault:
          ''',

              '''\tcase C.V2RayTransportTypeHTTPUpgrade:
          \t\treturn v2rayhttpupgrade.NewServer(ctx, logger, options.HTTPUpgradeOptions, tlsConfig, handler)
          \tcase C.V2RayTransportTypeXHTTP:
          \t\treturn xhttp.NewServer(ctx, logger, options.XHTTPOptions, tlsConfig, handler)
          \tdefault:
          ''',

              "Add XHTTP server"
          )


          replace_exact(
              "transport/v2ray/transport.go",

              '''\tcase C.V2RayTransportTypeHTTPUpgrade:
          \t\treturn v2rayhttpupgrade.NewClient(ctx, dialer, serverAddr, options.HTTPUpgradeOptions, tlsConfig)
          \tdefault:
          ''',

              '''\tcase C.V2RayTransportTypeHTTPUpgrade:
          \t\treturn v2rayhttpupgrade.NewClient(ctx, dialer, serverAddr, options.HTTPUpgradeOptions, tlsConfig)
          \tcase C.V2RayTransportTypeXHTTP:
          \t\treturn xhttp.NewClient(ctx, dialer, serverAddr, options.XHTTPOptions, tlsConfig)
          \tdefault:
          ''',

              "Add XHTTP client"
          )


          print("")
          print("==========================================")
          print("All XHTTP source replacements succeeded.")
          print("==========================================")
          PY


      - name: Format modified source
        shell: bash
        run: |
          set -euo pipefail

          gofmt -w \
            constant/v2ray.go \
            option/v2ray_transport.go \
            transport/v2ray/transport.go


      - name: Verify XHTTP integration
        shell: bash
        run: |
          set -euo pipefail

          echo "==> Checking constant..."
          grep -F \
            'V2RayTransportTypeXHTTP = "xhttp"' \
            constant/v2ray.go


          echo "==> Checking XHTTP options..."
          grep -F \
            'XHTTPOptions       xhttp.Options' \
            option/v2ray_transport.go


          echo "==> Checking MarshalJSON..."
          grep -F \
            'case C.V2RayTransportTypeXHTTP:' \
            option/v2ray_transport.go


          echo "==> Checking schema..."
          grep -F \
            'reflect.TypeFor[xhttp.Options]()' \
            option/v2ray_transport.go


          echo "==> Checking XHTTP server..."
          grep -F \
            'xhttp.NewServer' \
            transport/v2ray/transport.go


          echo "==> Checking XHTTP client..."
          grep -F \
            'xhttp.NewClient' \
            transport/v2ray/transport.go


          echo "All XHTTP integration points verified."


      - name: Download dependencies
        shell: bash
        run: |
          set -euo pipefail

          go mod download


      - name: Read official build configuration
        id: build-config
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -s release/DEFAULT_BUILD_TAGS ]; then
            echo "ERROR: release/DEFAULT_BUILD_TAGS is empty."
            exit 1
          fi

          if [ ! -s release/LDFLAGS ]; then
            echo "ERROR: release/LDFLAGS is empty."
            exit 1
          fi

          OFFICIAL_TAGS="$(
            tr '\n' ',' < release/DEFAULT_BUILD_TAGS |
            sed 's/,$//'
          )"

          if [ -z "$OFFICIAL_TAGS" ]; then
            echo "ERROR: Failed to read official build tags."
            exit 1
          fi

          echo "Official build tags:"
          echo "$OFFICIAL_TAGS"

          echo "Official linker flags:"
          cat release/LDFLAGS

          echo "official_tags=${OFFICIAL_TAGS}" >> "$GITHUB_OUTPUT"


      - name: Build sing-box
        shell: bash
        env:
          OFFICIAL_VERSION: ${{ needs.get-version.outputs.upstream_version }}
          OFFICIAL_TAGS: ${{ steps.build-config.outputs.official_tags }}
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail

          TAGS="${OFFICIAL_TAGS},with_purego,with_v2ray_api"

          LDFLAGS_SHARED="$(cat release/LDFLAGS)"

          mkdir -p release/package

          echo "=========================================="
          echo "Building sing-box"
          echo "Version : v${OFFICIAL_VERSION}"
          echo "Arch    : ${TARGET_ARCH}"
          echo "Tags    : ${TAGS}"
          echo "=========================================="

          GOOS=linux \
          GOARCH="${TARGET_ARCH}" \
          CGO_ENABLED=0 \
          go build \
            -v \
            -trimpath \
            -o release/package/sing-box \
            -tags "${TAGS}" \
            -ldflags "-X 'github.com/sagernet/sing-box/constant.Version=${OFFICIAL_VERSION}' ${LDFLAGS_SHARED} -s -w -buildid=" \
            ./cmd/sing-box

          chmod +x release/package/sing-box


      - name: Verify binary
        shell: bash
        env:
          EXPECTED_VERSION: ${{ needs.get-version.outputs.upstream_version }}
        run: |
          set -euo pipefail

          test -x release/package/sing-box

          echo "==> sing-box version:"
          release/package/sing-box version

          release/package/sing-box version |
            grep -F "version ${EXPECTED_VERSION}"


      - name: Check XHTTP configuration
        shell: bash
        run: |
          set -euo pipefail

          cat > release/xhttp-test.json <<'JSON'
          {
            "log": {
              "level": "error"
            },
            "inbounds": [
              {
                "type": "vless",
                "tag": "xhttp-in",
                "listen": "127.0.0.1",
                "listen_port": 18443,
                "users": [
                  {
                    "name": "xhttp-test",
                    "uuid": "8a21b0ab-c9a6-4763-bbc5-9a170a8a1869"
                  }
                ],
                "transport": {
                  "type": "xhttp",
                  "mode": "auto",
                  "path": "/xhttp"
                }
              }
            ],
            "outbounds": [
              {
                "type": "vless",
                "tag": "xhttp-out",
                "server": "127.0.0.1",
                "server_port": 18443,
                "uuid": "8a21b0ab-c9a6-4763-bbc5-9a170a8a1869",
                "transport": {
                  "type": "xhttp",
                  "mode": "auto",
                  "path": "/xhttp"
                }
              },
              {
                "type": "direct",
                "tag": "direct"
              }
            ]
          }
          JSON

          release/package/sing-box \
            check \
            -c release/xhttp-test.json

          echo "XHTTP inbound configuration: OK"
          echo "XHTTP outbound configuration: OK"


      - name: Generate and verify schema
        shell: bash
        run: |
          set -euo pipefail

          release/package/sing-box \
            generate \
            schema \
            > release/schema.json

          grep -F '"xhttp"' release/schema.json

          echo "XHTTP schema: OK"


      - name: Create fixed release archive
        shell: bash
        env:
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail

          mkdir -p release

          case "${TARGET_ARCH}" in
            amd64)
              ARCHIVE="release/sing-box-linux-amd64.tar.gz"
              ;;
            arm64)
              ARCHIVE="release/sing-box-linux-arm64.tar.gz"
              ;;
            *)
              echo "ERROR: Unsupported architecture: ${TARGET_ARCH}"
              exit 1
              ;;
          esac

          tar \
            -C release/package \
            -czf "${ARCHIVE}" \
            sing-box

          test -f "${ARCHIVE}"

          echo "Created:"
          ls -lh "${ARCHIVE}"

          echo "Archive contents:"
          tar -tzf "${ARCHIVE}"


      - name: Verify archive
        shell: bash
        env:
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail

          case "${TARGET_ARCH}" in
            amd64)
              ARCHIVE="release/sing-box-linux-amd64.tar.gz"
              ;;
            arm64)
              ARCHIVE="release/sing-box-linux-arm64.tar.gz"
              ;;
            *)
              echo "ERROR: Unsupported architecture."
              exit 1
              ;;
          esac

          test -f "${ARCHIVE}"

          tar -tzf "${ARCHIVE}" |
            grep -Fx "sing-box"

          echo "Archive verification: OK"


      - name: Generate SHA256
        shell: bash
        run: |
          set -euo pipefail

          cd release

          sha256sum \
            sing-box-linux-amd64.tar.gz \
            sing-box-linux-arm64.tar.gz \
            2>/dev/null || true

          if [ -f "sing-box-linux-amd64.tar.gz" ]; then
            sha256sum sing-box-linux-amd64.tar.gz > SHA256SUMS
          fi

          if [ -f "sing-box-linux-arm64.tar.gz" ]; then
            sha256sum sing-box-linux-arm64.tar.gz >> SHA256SUMS
          fi

          cat SHA256SUMS


      - name: Upload amd64 archive
        if: matrix.arch == 'amd64'
        uses: actions/upload-artifact@v4
        with:
          name: sing-box-linux-amd64
          path: |
            release/sing-box-linux-amd64.tar.gz
          if-no-files-found: error


      - name: Upload arm64 archive
        if: matrix.arch == 'arm64'
        uses: actions/upload-artifact@v4
        with:
          name: sing-box-linux-arm64
          path: |
            release/sing-box-linux-arm64.tar.gz
          if-no-files-found: error


  release:
    needs:
      - get-version
      - build

    runs-on: ubuntu-24.04

    steps:
      - name: Download amd64 archive
        uses: actions/download-artifact@v4
        with:
          name: sing-box-linux-amd64
          path: release

      - name: Download arm64 archive
        uses: actions/download-artifact@v4
        with:
          name: sing-box-linux-arm64
          path: release

      - name: Verify final release files
        shell: bash
        run: |
          set -euo pipefail

          test -f release/sing-box-linux-amd64.tar.gz
          test -f release/sing-box-linux-arm64.tar.gz

          echo "Final release files:"
          ls -lh \
            release/sing-box-linux-amd64.tar.gz \
            release/sing-box-linux-arm64.tar.gz

          echo "==> amd64:"
          tar -tzf release/sing-box-linux-amd64.tar.gz

          echo "==> arm64:"
          tar -tzf release/sing-box-linux-arm64.tar.gz

          cd release

          sha256sum \
            sing-box-linux-amd64.tar.gz \
            sing-box-linux-arm64.tar.gz \
            > SHA256SUMS

          cat SHA256SUMS


      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.get-version.outputs.upstream_version }}-xhttp-${{ needs.get-version.outputs.xhttp_version }}
          name: sing-box v${{ needs.get-version.outputs.upstream_version }} + XHTTP ${{ needs.get-version.outputs.xhttp_version }}
          make_latest: false
          generate_release_notes: false

          body: |
            Based on official SagerNet/sing-box:

            - sing-box: v${{ needs.get-version.outputs.upstream_version }}
            - sing-xhttp: ${{ needs.get-version.outputs.xhttp_version }}

            XHTTP:
            - inbound / server
            - outbound / client
            - transport.type = xhttp

            Build:
            - official release/DEFAULT_BUILD_TAGS
            - official release/LDFLAGS
            - with_purego
            - with_v2ray_api

            Architectures:
            - Linux amd64
            - Linux arm64

          files: |
            release/sing-box-linux-amd64.tar.gz
            release/sing-box-linux-arm64.tar.gz
            release/SHA256SUMS
